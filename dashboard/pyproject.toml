[project]
name = "power-desk-dashboard"
version = "0.1.0"
description = "Read-only analyst dashboard over the warehouse's marts: FastAPI backend and its browser frontend (frontend/)"
requires-python = ">=3.13"
dependencies = [
    "duckdb>=1.1.0",
    "fastapi>=0.115.0",
    "jinja2>=3.1.0",
    "power-desk-warehouse",
    "pydantic>=2.0.0",
    "uvicorn[standard]>=0.30.0",
]

[project.scripts]
power-desk = "power_desk_dashboard.app:main"
power-desk-register-widget = "power_desk_dashboard.register_widget:main"

[dependency-groups]
# the integration tests build the seed week's warehouse with the ELT; the package itself only reads it
dev = ["httpx>=0.27.0", "power-desk-elt"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"
venvPath = ".."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
