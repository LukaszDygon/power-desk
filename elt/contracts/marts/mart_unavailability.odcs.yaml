      (`mean`: time-weighted over the minutes holding data; `sum`: pro-rated into the hour); `coverage` is the fraction of
      the hour holding data. Filter time with `timestamp_utc >= <start> and timestamp_utc < <end>`.


      One row per event, asset and hour; the series is `mrid` and `source_code`, not the dimension keys alone, since several
      events can affect one asset at the same time. For GB totals by technology, query `mart_gb_generation_unavailability`.'
    constraints:
