  context:
    instructions: 'One row per series and hour holding data: `timestamp_utc` is the UTC hour start, the series every dimension
      key plus `source_dataset` and `source_code`. Each measure is aggregated into the hour as its `hourlyAggregation` says
      (`mean`: time-weighted over the minutes holding data; `sum`: pro-rated into the hour); `coverage` is the fraction of
