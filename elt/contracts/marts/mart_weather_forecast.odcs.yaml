        levels (bidding zone, control area, country). Filter on a `dim_area` role (e.g. `is_bidding_zone`) or roll up with
        `bridge_area_hierarchy`.'
    - constraint: 'Do not add up rows of different `source_dataset` for the same quantity, area and hour: sources overlap
        (e.g. GB from Elexon and from ENTSO-E) and their definitions differ. Keep one source per quantity and area.'
    - constraint: Do not read a missing hour or a null measure as zero; zero is a published value.
    - constraint: A row is the latest forecast run (`publish_time_utc`) covering the hour; for a forecast as it stood at an
        earlier time, query `ods_weather_forecast` by `publish_time_utc`.
    - constraint: Values are at the site's nearest 0.25° grid point, a grid-box value, not a measurement at the site; sites
        can share a grid point.
    - constraint: Instantaneous measures (temperature, wind, cloud cover) are forecast every 3 or 6 hours and held until the
        next step; within those hours they are the step's value, not an hourly forecast.
    - constraint: Solar radiation and precipitation carry ECMWF's packing precision, which follows each field's range (on
        the acceptance run up to about 24 W/m² and 0.25 mm per forecast interval), and can be slightly negative; floor at
        zero before summing.
    - constraint: Do not mix `source_dataset`s (forecast models) of the same site and hour; pick one.
