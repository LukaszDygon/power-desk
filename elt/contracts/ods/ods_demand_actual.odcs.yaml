  description: 'Actual demand per area and interval, across sources: GB national demand per settlement period,

    ENTSO-E actual total load per market time unit.


    **Initial National Demand outturn (INDO)**


    The endpoint provides data showing the initial National Demand outturn. Data is updated at 15 min intervals containing
    the initial demand expressed in MW.


    The half-hour average MW demand metered by the Transmission Company based on its operational metering. The data is updated
    every 30 minutes and within 15 minutes of the end of the effective Settlement Period.


    The demand metered by the National Electricity Transmission System Operator (NETSO) taking into account transmission losses
    but not including station transformer load, pumped storage demand or Interconnector demand.

    References to INDO in Section Q6.1.13 and in Table 1 of Section V Annex V-1 mean the half-hour average INDO for a Settlement
    Period. References to INDO in Section G3.1.4 mean the spot time INDO measured by the NETSO in accordance with that paragraph.


    **Actual total load per bidding zone per market time unit**


    The total load per market time unit: the sum of power generated by plants on both TSO and DSO networks, minus the balance
    of exchanges with neighbouring bidding zones and the power absorbed by energy storage. The average of real-time load values
    over the market time unit, including losses; published at the latest one hour after the operating period.'
