  description: 'Day-ahead demand forecast per area and interval, across sources: GB national demand forecast per

    settlement period, ENTSO-E day-ahead total load forecast per market time unit.


    **Day and day-ahead National Demand forecast (NDF)**


    This endpoint provides the National Demand forecast received from NGESO. Data is available daily and will show values
    for the day ahead. Expressed as an average MW value for each settlement period. The forecast is based on historically
    metered generation output for Great Britain. This value INCLUDES transmission losses, but EXCLUDES interconnector flows
    and demand from station transformers and pumped storage units.


    The National Demand Forecast is made by the System Operator. The System Operator National Demand Forecast is based on
    historically metered generation output for Great Britain. This value includes transmission losses, but excludes Interconnector
    flows and demand from station transformers and pumped storage units.

    The National Demand Forecast is comparable with the Initial National Demand Out-Turn INDO. All the forecasts are unrestricted,
    i.e. any notified customer demand management is included in the history.


    **Day-ahead forecast of the total load per market time unit**


    A day-ahead forecast of the total load per bidding zone per market time unit, published at the latest two hours before
    day-ahead gate closure (or D-1 12:00 local time where there is none) and updated when a market time unit changes by at
    least 10%. Given for information only; based on historic load profiles and weather.'
