  description: 'Actual generation per area, technology and interval, across sources: GB at 5-minute grain

    (FUELINST fuel types plus PVLive solar), ENTSO-E areas per market time unit and production type.

    ENTSO-E publishes the same generation at several area levels.


    **Instantaneous generation outturn by fuel type (FUELINST)**


    This endpoint provides the instantaneous generation outturn (Generation By Fuel type) to give our users an indication
    of the generation outturn for Great Britain. The data is aggregated by Fuel Type category and updated at five-minute intervals
    with average MW values over 5 minutes for each category.


    National Grid measure system generation connected to the high voltage transmission system in real-time from operational
    metering. This is used in control timescales to assist with balancing the system and confirming that generators are operating
    at their expected levels. To provide market participants with information relating to the levels of generation, this metering
    is aggregated into fuel type categories. The data is provided as 5 minute average MW values.


    **GB national solar generation outturn (PVLive)**


    Sheffield Solar PVLive estimate of GB solar PV generation, national total (PES region 0), one row per half hour keyed
    on the half-hour *ending* time. Not an Elexon dataset; FUELINST carries no solar, so PVLive provides the SOLAR fuel type
    downstream.


    **Aggregated generation per type**


    Actual aggregated net generation output per market time unit and per production type: the average of the available instantaneous
    net output values (small units may be estimated). Includes actual wind and solar generation. Published at the latest one
    hour after the operational period.'
