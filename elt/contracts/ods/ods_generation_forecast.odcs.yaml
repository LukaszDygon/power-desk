    **Wind generation forecast (WINDFOR)**


    This endpoint provides wind generation forecast data.


    A forecast of generation for all Power Park Modules.

    This daily forecast provides values for 4 different times of day (04:30, 10:30, 16:30, 22:30) and each forecast includes
    49 values covering the period from 21:00 on the current day (D) to 21:00 D+2.


    **Day-ahead generation forecasts for wind and solar**


    Forecasts of wind and solar net generation per bidding zone per market time unit of the following day, as three values:
    day-ahead (fixed at 18:00 Brussels time the day before), intraday (fixed at 08:00 Brussels time on the day) and current
