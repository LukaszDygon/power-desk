  description: 'Transfer capacity per oriented couple of areas, time horizon and interval, across sources: ENTSO-E

    forecasted transfer capacities (year-, month-, week- and day-ahead, every area level published) and

    NESO''s restrictions per GB interconnector and auction, one row per direction. NESO''s values are its

    input to the capacity calculation, not the final capacity offered.


    **Forecasted transfer capacities**


    The forecasted capacity (MW) per direction between areas, under coordinated net transmission capacity based allocation,
    calculated by TSOs or transmission capacity allocators ahead of the allocation process: year-ahead (a value per month),
    month-ahead and week-ahead (a value per day) and day-ahead (per market time unit). Where several data providers submit
    for the same oriented couple of areas, the platform publishes the minimum value; a new version replaces the previous one.
    Not published for regions and time horizons where flow-based allocation is conducted.


    **IFA, NESO''s intraday transfer limit**


    The values NESO submits to the interconnector capacity calculation processes, restricting the maximum GB import and export
    flows, in MW per hourly period, per day-ahead or intraday auction. The final capacity is calculated from these values,
    those of the connected system operator and the interconnector''s capability, so it may be lower than NESO''s. Values are
    published only where NESO applied a restriction.'
