    **Initial Transmission System Demand outturn (ITSDO)**


    The endpoint provides data showing the initial Transmission System Demand outturn. Data is updated at 15 min intervals
    containing the initial demand expressed in MW.


    The average megawatt value of demand for a Settlement Period including transmission losses, station transformer load,
    pumped storage demand and interconnector demand.

    The ITSDO is made available by the System Operator within 15 minutes after a Settlement Period, based on their operational
    metering. The composition of the Initial Transmission System Demand Out-Turn matches that of the Transmission System Demand
