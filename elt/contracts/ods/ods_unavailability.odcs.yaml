    revision (`is_latest_revision`) applies. An open-ended event has no `interval_minutes`. REMIT has no

    hourly mart: combine it with the data it concerns in the query.


    **REMIT messages (urgent market messages)**


    The Regulation on Wholesale Energy Markets Integrity and Transparency (REMIT) is an EU regulation aimed at preventing
    market abuse in wholesale energy markets.


    This endpoint returns information provided by market participants to comply with Article 4 of Regulation on Wholesale
    Energy Market Integrity and Transparency (REMIT) Regulation (EU) 1227/2011.'
