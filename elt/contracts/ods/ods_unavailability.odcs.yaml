  context:
    instructions: 'Rows at the interval the source published: `timestamp_utc` (UTC start) and `interval_minutes`. One entity
      holds every resolution and republication published, so intervals can overlap; for hourly or summed series, query the
      entity''s hourly mart (`mart_<entity>`, where it has one), which resolves the overlaps.


      For the unavailability as currently known, filter `is_latest_revision`; for what was known at a time T, take each event''s
      latest revision with `publish_time_utc` <= T. An interval ends at `timestamp_utc + interval_minutes`; for hourly figures,
      split the intervals across the hours they overlap in the query.'
    constraints:
    - constraint: Do not sum rows of different `interval_minutes` or overlapping intervals; aggregate the hourly mart.
    - constraint: 'Do not sum or average across `area_eic_code` before choosing one area level: areas are published at several
        levels (bidding zone, control area, country). Filter on a `dim_area` role (e.g. `is_bidding_zone`) or roll up with
        `bridge_area_hierarchy`.'
    - constraint: 'Do not sum across revisions of one event (`mrid`): each revision restates the event. Filter `is_latest_revision`
        (or the revision applicable at the time you need).'
    - constraint: Exclude `event_status` = 'Dismissed' (events cancelled or withdrawn) when counting unavailable capacity.
    - constraint: 'Sum `unavailable_capacity_mw` across concurrent events, never `available_capacity_mw`: each event reports
        only the capacity it makes unavailable, but the facility''s whole remaining capacity.'
    - constraint: '`resource_code` is null where the asset (`source_code`) is not a BM Unit in Elexon''s list; group by `source_code`
