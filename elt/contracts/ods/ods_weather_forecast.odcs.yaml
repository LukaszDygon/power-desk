    - constraint: Every run is kept (`publish_time_utc`); one run per query, or the hourly mart for the latest.
    - constraint: Two forecast models cover the same sites and hours (`source_dataset` `ECMWF_IFS_OPER` and `ECMWF_AIFS_SINGLE`,
