  description: 'Weather forecasts per site, run and forecast interval: ECMWF IFS (00z and 12z runs) and AIFS Single

    (00z, 06z, 12z and 18z runs) at the nearest 0.25° grid point of each REPD operational wind and solar

    site of at least 50 MW. An interval runs from one published step to the next (IFS: 3 hours to 144

    hours ahead, 6 hours after; AIFS Single: 6 hours throughout); accumulated fields (solar radiation,

    precipitation) cover the interval, the instantaneous ones are its start.


    **ECMWF IFS medium-range forecast (atmosphere), 0.25°**


    "A subset of ECMWF real-time forecast data from the IFS and AIFS models is made available to the public free of charge",
    from "real-time forecast data on a rolling archive basis" of "the four daily IFS and AIFS cycles (00, 06, 12 and 18 UTC)".
    This table holds the IFS medium-range forecast (atmosphere, `stream=oper`, `type=fc`) at 0.25°, "produced from the same
    high-resolution (~9 km) forecast" as the 0.1° data, for the 00z and 12z runs: "0 to 144 by 3, 150 to 360 by 6" hours.


    **ECMWF AIFS Single forecast (atmosphere), 0.25°**


    "A subset of ECMWF real-time forecast data from the IFS and AIFS models is made available to the public free of charge",
    from "real-time forecast data on a rolling archive basis" of "the four daily IFS and AIFS cycles (00, 06, 12 and 18 UTC)".
    This table holds the AIFS Single forecast (atmosphere, `model=aifs-single`, `stream=oper`, `type=fc`) at 0.25° ("the AIFS
    streams remain 0.25° only"), for "4 forecast runs per day (00/06/12/18)" with "6 hourly steps to 360 (15 days)". "AIFS
    data are released as soon as the data are produced."'
  dataGranularityDescription: One row per timestamp_utc, site_code, publish_time_utc, source_dataset.
