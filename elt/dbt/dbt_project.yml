name: power_desk
version: "1.0.0"
profile: power_desk

model-paths: [models]
macro-paths: [macros]
seed-paths: [seeds]
test-paths: [tests]
target-path: target
clean-targets: [target]

vars:
  # First date the warehouse must cover; completeness tests start here.
  backfill_start_date: "{{ env_var('POWER_DESK_START_DATE', '2024-01-01') }}"
  # REPD sites the ECMWF source reads weather for; must equal ingest/sources/ecmwf.py (SITE_*)
  weather_site_status: Operational
  weather_site_technologies: [Wind Onshore, Wind Offshore, Solar Photovoltaics]
  weather_site_min_capacity_mw: 50
  # Set by the orchestrator (see macros/dlt_loads.sql):
  #   dlt_load_ids: explicit list of dlt load ids this invocation processes
  #   dlt_scope: "recent" (default, tests see only pending loads) | "all"
  #   orchestrator_run_id: Dagster run id, recorded in dlt_meta.dlt_load_audit

on-run-end:
  - "{{ dlt_mark_loads_processed(results) }}"

models:
  power_desk:
    dlt_meta:
      +schema: dlt_meta
      +materialized: view
    # staging/<source>/: 1:1 typed views over one source's raw tables (stg_<source>__<table>)
    staging:
      +schema: staging
      +materialized: view
      +meta:
        dlt_recent_column: _dlt_load_id
    # ods/: source-agnostic entities; each unions the staging models that provide it. Incremental
    # tables: a build replaces the (area, hour) partitions pending loads touch (macros/dlt/partitions.sql)
    ods:
      +schema: ods
      +materialized: incremental
      +incremental_strategy: delete+insert
      +unique_key: [timestamp_utc, area_eic_code, source_dataset]
      +meta:
        dlt_tracked: true
        dlt_recent_column: _dlt_load_id
        # query guidance, exported into each model's data contract (elt/contracts, docs/data-contracts.md)
        layer_context:
          instructions: >-
            Rows at the interval the source published: `timestamp_utc` (UTC start) and `interval_minutes`. One
            entity holds every resolution and republication published, so intervals can overlap; for hourly or
            summed series, query the entity's hourly mart (`mart_<entity>`), which resolves the overlaps.
          constraints:
            - Do not sum rows of different `interval_minutes` or overlapping intervals; aggregate the hourly mart.
            - >-
              Do not sum or average across `area_eic_code` before choosing one area level: areas are published at
              several levels (bidding zone, control area, country). Filter on a `dim_area` role (e.g.
              `is_bidding_zone`) or roll up with `bridge_area_hierarchy`.
    # dims/: conformed dimensions + hierarchy bridges (reference data, every version kept)
    dims:
      +schema: dims
      +materialized: table
      +meta:
        layer_context:
          instructions: >-
            Dimensions explain the keys of entities and marts. Versioned dimensions keep one row per published
            version (`valid_from`, `valid_to`, `is_current`). `bridge_*_hierarchy` relates each key to itself
            (`depth` 0) and every broader key, so a roll-up to any level is one join.
          constraints:
            - >-
              Do not join a versioned dimension on its key alone, which repeats the row per version: add
              `is_current` (or the version valid at the row's time).
    marts:
      +schema: marts
      # marts/combined/: one hourly table per entity across sources and areas (values, coverage, dimension
      # keys, provenance), rebuilt for the (series, hour) pairs pending loads touch (macros/time/hourly_series.sql)
      combined:
        +materialized: incremental
        +incremental_strategy: delete+insert
        +meta:
          dlt_tracked: true
          dlt_recent_column: _last_dlt_load_id
          layer_context:
            instructions: >-
              One row per series and hour holding data: `timestamp_utc` is the UTC hour start, the series every
              dimension key plus `source_dataset` and `source_code`. Each measure is aggregated into the hour as
              its `hourlyAggregation` says (`mean`: time-weighted over the minutes holding data; `sum`: pro-rated
              into the hour); `coverage` is the fraction of the hour holding data. Filter time with
              `timestamp_utc >= <start> and timestamp_utc < <end>`.
            constraints:
              - >-
                Do not sum or average across `area_eic_code` before choosing one area level: areas are published
                at several levels (bidding zone, control area, country). Filter on a `dim_area` role (e.g.
                `is_bidding_zone`) or roll up with `bridge_area_hierarchy`.
              - >-
                Do not add up rows of different `source_dataset` for the same quantity, area and hour: sources
                overlap (e.g. GB from Elexon and from ENTSO-E) and their definitions differ. Keep one source per
                quantity and area.
              - Do not read a missing hour or a null measure as zero; zero is a published value.
      # marts/<scope>/: incremental business tables, rebuilt for the grains pending loads touch
      gb:
        +materialized: incremental
        +incremental_strategy: delete+insert
        +meta:
          dlt_tracked: true
          dlt_recent_column: _last_dlt_load_id

# Curated dimensions (seeds/dims) and publisher-code mappings (seeds/mappings) live in the
# same schema as the published dimensions they extend.
seeds:
  power_desk:
    +schema: dims

data_tests:
  power_desk:
    +store_failures: true
    +schema: test_failures
