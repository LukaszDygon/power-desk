# Hourly marts, one per entity: every source and area on an hourly spine (macros/time/hourly_series.sql).
# A row per series (the dimension keys) and hour holding data; overlapping published periods resolve to the
# most recently published, and `coverage` is the fraction of the hour with data. Areas are published at
# several levels (e.g. ENTSO-E bidding zone, control area, country): pick a level before summing areas.
models:
  - name: mart_generation_actual
    description: |
      Actual generation per area, technology and hour, for every source and area. Grain: `timestamp_utc` (hour start) and the series (`area_eic_code`, `technology_code`, `border_area_eic_code`, `source_dataset`, `source_code`).
    config:
      meta:
        context:
          instructions: >-
            `consumption_mw` is power absorbed (pumped storage, energy storage), published separately from
            `generation_mw`.
          constraints:
            - >-
              Rows with `technology_code` `interconnector` are flows over the border in `border_area_eic_code`,
              negative when the area exports: exclude them from domestic generation.
    data_tests:
      - dlt_unique:
          name: mart_generation_actual_unique_key
          arguments:
            columns: [timestamp_utc, _series_key]
      - expression_is_true:
          name: mart_generation_actual_coverage_in_range
          arguments:
            expression: "coverage > 0 and coverage <= 1"
    columns:
      - name: timestamp_utc
        description: "{{ doc('col_timestamp_utc') }}"
        data_tests: [not_null]
      - name: area_eic_code
        description: "{{ doc('col_area_eic_code') }}"
        data_tests:
          - relationships:
              name: mart_generation_actual_known_area
              arguments:
                to: ref('dim_area')
                field: area_eic_code
      - name: technology_code
        description: "{{ doc('col_technology_code') }}"
        data_tests:
          - relationships:
              name: mart_generation_actual_known_technology
              arguments:
                to: ref('dim_technology')
                field: technology_code
      - name: border_area_eic_code
        description: "{{ doc('col_border_area_eic_code') }}"
        data_tests:
          - relationships:
              name: mart_generation_actual_known_border_area
              arguments:
                to: ref('dim_border')
                field: border_area_eic_code
      - name: source_dataset
        description: "{{ doc('col_source_dataset') }}"
      - name: source_code
        description: "{{ doc('col_source_code') }}"
      - name: generation_mw
        description: "{{ doc('col_generation_mw') }}"
      - name: consumption_mw
        description: "{{ doc('col_consumption_mw') }}"
      - name: coverage
        description: "{{ doc('col_coverage') }}"
      - name: publish_time_utc
        description: "{{ doc('col_publish_time_utc') }}"
      - name: _series_key
        description: "{{ doc('col__series_key') }}"
      - name: _last_dlt_load_id
        description: "{{ doc('col__last_dlt_load_id') }}"

  - name: mart_generation_forecast
    description: |
      Generation forecasts per area, technology, horizon and hour, for every source and area. Grain: `timestamp_utc` (hour start) and the series (`area_eic_code`, `technology_code`, `time_horizon`, `source_dataset`, `source_code`).
    config:
      meta:
        context:
          constraints:
            - Do not mix `time_horizon`s, each a separate forecast of the same hour; pick one (e.g. `day_ahead`).
    data_tests:
      - dlt_unique:
          name: mart_generation_forecast_unique_key
          arguments:
            columns: [timestamp_utc, _series_key]
      - expression_is_true:
          name: mart_generation_forecast_coverage_in_range
          arguments:
            expression: "coverage > 0 and coverage <= 1"
    columns:
      - name: timestamp_utc
        description: "{{ doc('col_timestamp_utc') }}"
        data_tests: [not_null]
      - name: area_eic_code
        description: "{{ doc('col_area_eic_code') }}"
        data_tests:
          - relationships:
              name: mart_generation_forecast_known_area
              arguments:
                to: ref('dim_area')
                field: area_eic_code
      - name: technology_code
        description: "{{ doc('col_technology_code') }}"
        data_tests:
          - relationships:
              name: mart_generation_forecast_known_technology
              arguments:
                to: ref('dim_technology')
                field: technology_code
      - name: time_horizon
        description: "{{ doc('col_time_horizon') }}"
        data_tests:
          - relationships:
              name: mart_generation_forecast_known_horizon
              arguments:
                to: ref('dim_time_horizon')
                field: time_horizon
      - name: source_dataset
        description: "{{ doc('col_source_dataset') }}"
      - name: source_code
        description: "{{ doc('col_source_code') }}"
      - name: generation_mw
        description: "{{ doc('col_generation_forecast_mw') }}"
      - name: coverage
        description: "{{ doc('col_coverage') }}"
      - name: publish_time_utc
        description: "{{ doc('col_publish_time_utc') }}"
      - name: _series_key
        description: "{{ doc('col__series_key') }}"
      - name: _last_dlt_load_id
        description: "{{ doc('col__last_dlt_load_id') }}"

  - name: mart_demand_actual
    description: |
      Actual demand per area and hour, for every source and area. Grain: `timestamp_utc` (hour start) and the series (`area_eic_code`, `source_dataset`).
    data_tests:
      - dlt_unique:
          name: mart_demand_actual_unique_key
          arguments:
            columns: [timestamp_utc, _series_key]
      - expression_is_true:
          name: mart_demand_actual_coverage_in_range
          arguments:
            expression: "coverage > 0 and coverage <= 1"
    columns:
      - name: timestamp_utc
        description: "{{ doc('col_timestamp_utc') }}"
        data_tests: [not_null]
      - name: area_eic_code
        description: "{{ doc('col_area_eic_code') }}"
        data_tests:
          - relationships:
              name: mart_demand_actual_known_area
              arguments:
                to: ref('dim_area')
                field: area_eic_code
      - name: source_dataset
        description: "{{ doc('col_source_dataset') }}"
      - name: demand_mw
        description: "{{ doc('col_demand_mw') }}"
      - name: coverage
        description: "{{ doc('col_coverage') }}"
      - name: publish_time_utc
        description: "{{ doc('col_publish_time_utc') }}"
      - name: _series_key
        description: "{{ doc('col__series_key') }}"
      - name: _last_dlt_load_id
        description: "{{ doc('col__last_dlt_load_id') }}"

  - name: mart_demand_forecast
    description: |
      Demand forecasts per area, horizon and hour, for every source and area. Grain: `timestamp_utc` (hour start) and the series (`area_eic_code`, `time_horizon`, `source_dataset`).
    config:
      meta:
        context:
          constraints:
            - Do not mix `time_horizon`s, each a separate forecast of the same hour; pick one (e.g. `day_ahead`).
    data_tests:
      - dlt_unique:
          name: mart_demand_forecast_unique_key
          arguments:
            columns: [timestamp_utc, _series_key]
      - expression_is_true:
          name: mart_demand_forecast_coverage_in_range
          arguments:
            expression: "coverage > 0 and coverage <= 1"
    columns:
      - name: timestamp_utc
        description: "{{ doc('col_timestamp_utc') }}"
        data_tests: [not_null]
      - name: area_eic_code
        description: "{{ doc('col_area_eic_code') }}"
        data_tests:
          - relationships:
              name: mart_demand_forecast_known_area
              arguments:
                to: ref('dim_area')
                field: area_eic_code
      - name: time_horizon
        description: "{{ doc('col_time_horizon') }}"
        data_tests:
          - relationships:
              name: mart_demand_forecast_known_horizon
              arguments:
                to: ref('dim_time_horizon')
                field: time_horizon
      - name: source_dataset
        description: "{{ doc('col_source_dataset') }}"
      - name: demand_mw
        description: "{{ doc('col_forecast_demand_mw') }}"
      - name: coverage
        description: "{{ doc('col_coverage') }}"
      - name: publish_time_utc
        description: "{{ doc('col_publish_time_utc') }}"
      - name: _series_key
        description: "{{ doc('col__series_key') }}"
      - name: _last_dlt_load_id
        description: "{{ doc('col__last_dlt_load_id') }}"

  - name: mart_energy_price
    description: |
      Electricity prices per area, horizon and hour, for every source and area; prices in `currency` per MWh. Grain: `timestamp_utc` (hour start) and the series (`area_eic_code`, `time_horizon`, `classification_sequence`, `currency`, `source_dataset`, `source_code`).
    config:
      meta:
        context:
          constraints:
            - Do not average or compare prices of different `currency` without converting them.
            - >-
              Pick one `time_horizon` and `classification_sequence` per series. Elexon MID (`time_horizon` null)
              has a price per data provider (`source_code`): pick one, or weight by `volume_mwh` as settlement
              does for the Market Price.
    data_tests:
      - dlt_unique:
          name: mart_energy_price_unique_key
          arguments:
            columns: [timestamp_utc, _series_key]
      - expression_is_true:
          name: mart_energy_price_coverage_in_range
          arguments:
            expression: "coverage > 0 and coverage <= 1"
    columns:
      - name: timestamp_utc
        description: "{{ doc('col_timestamp_utc') }}"
        data_tests: [not_null]
      - name: area_eic_code
        description: "{{ doc('col_area_eic_code') }}"
        data_tests:
          - relationships:
              name: mart_energy_price_known_area
              arguments:
                to: ref('dim_area')
                field: area_eic_code
      - name: time_horizon
        description: "{{ doc('col_time_horizon') }}"
        data_tests:
          - relationships:
              name: mart_energy_price_known_horizon
              arguments:
                to: ref('dim_time_horizon')
                field: time_horizon
      - name: classification_sequence
        description: "{{ doc('col_classification_sequence') }}"
      - name: currency
        description: "{{ doc('col_currency') }}"
      - name: source_dataset
        description: "{{ doc('col_source_dataset') }}"
      - name: source_code
        description: "{{ doc('col_source_code') }}"
      - name: price_per_mwh
        description: "{{ doc('col_price_per_mwh') }}"
      - name: volume_mwh
        description: "{{ doc('col_volume_mwh') }}"
      - name: coverage
        description: "{{ doc('col_coverage') }}"
      - name: publish_time_utc
        description: "{{ doc('col_publish_time_utc') }}"
      - name: _series_key
        description: "{{ doc('col__series_key') }}"
      - name: _last_dlt_load_id
        description: "{{ doc('col__last_dlt_load_id') }}"

  - name: mart_transfer_capacity
    description: |
      Transfer capacities per oriented couple of areas, horizon and hour, for every source. NESO rows are per interconnector (`border_area_eic_code`). Grain: `timestamp_utc` (hour start) and the series (`out_area_eic_code`, `in_area_eic_code`, `border_area_eic_code`, `time_horizon`, `source_dataset`, `source_code`).
    config:
      meta:
        context:
          instructions: >-
            Capacities are directional, from `out_area_eic_code` to `in_area_eic_code`. NESO rows are per
            interconnector (`border_area_eic_code`) and give NESO's input to the capacity calculation, not the
            final capacity offered.
          constraints:
            - Do not mix `time_horizon`s; pick one per series.
    data_tests:
      - dlt_unique:
          name: mart_transfer_capacity_unique_key
          arguments:
            columns: [timestamp_utc, _series_key]
      - expression_is_true:
          name: mart_transfer_capacity_coverage_in_range
          arguments:
            expression: "coverage > 0 and coverage <= 1"
    columns:
      - name: timestamp_utc
        description: "{{ doc('col_timestamp_utc') }}"
        data_tests: [not_null]
      - name: out_area_eic_code
        description: "{{ doc('col_out_area_eic_code') }}"
        data_tests:
          - relationships:
              name: mart_transfer_capacity_known_out_area
              config:
                severity: warn
              arguments:
                to: ref('dim_area')
                field: area_eic_code
      - name: in_area_eic_code
        description: "{{ doc('col_in_area_eic_code') }}"
        data_tests:
          - relationships:
              name: mart_transfer_capacity_known_in_area
              config:
                severity: warn
              arguments:
                to: ref('dim_area')
                field: area_eic_code
      - name: border_area_eic_code
        description: "{{ doc('col_border_area_eic_code') }}"
        data_tests:
          - relationships:
              name: mart_transfer_capacity_known_border_area
              arguments:
                to: ref('dim_border')
                field: border_area_eic_code
      - name: time_horizon
        description: "{{ doc('col_time_horizon') }}"
        data_tests:
          - relationships:
              name: mart_transfer_capacity_known_horizon
              arguments:
                to: ref('dim_time_horizon')
                field: time_horizon
      - name: source_dataset
        description: "{{ doc('col_source_dataset') }}"
      - name: source_code
        description: "{{ doc('col_source_code') }}"
      - name: transfer_capacity_mw
        description: "{{ doc('col_transfer_capacity_mw') }}"
      - name: restriction_reason
        description: "{{ doc('col_restriction_reason') }}"
      - name: coverage
        description: "{{ doc('col_coverage') }}"
      - name: publish_time_utc
        description: "{{ doc('col_publish_time_utc') }}"
      - name: _series_key
        description: "{{ doc('col__series_key') }}"
      - name: _last_dlt_load_id
        description: "{{ doc('col__last_dlt_load_id') }}"

  - name: mart_unavailability
    description: |
      Unavailability of electricity facilities per REMIT event, unit and hour: each event's latest revision on an
      hourly spine. Grain: `timestamp_utc` (hour start), `mrid` and `source_code` (the asset). Capacities are
      time-weighted over the seconds of the hour the event covers (`coverage`); open-ended events (no event stop)
      are not placed. Dismissed events are kept, with their `event_status`.
    config:
      meta:
        context:
          instructions: >-
            One row per event, asset and hour; the series is `mrid` and `source_code`, not the dimension keys
            alone, since several events can affect one asset at the same time. For GB totals by technology,
            query `mart_gb_generation_unavailability`.
          constraints:
            - Exclude `event_status` = 'Dismissed' (events cancelled or withdrawn).
            - >-
              Sum `unavailable_capacity_mw * coverage` across events for the hour's unavailable capacity; never
              sum `available_capacity_mw`, which each event reports for the whole facility.
            - >-
              Events lasting beyond the horizon of interest (some run to 2050) are planned figures: filter
              `timestamp_utc` to the period you need.
            - >-
              Do not filter on `area_eic_code` = '10YGB----------A' alone for GB figures: Elexon publishes the
              nonconforming code `10YGB----------B` as the bidding zone of some messages, which `dim_area` reads as
              GB (seed `nonconforming_eic_codes`). Join `dim_area` and filter or group on
              `registered_area_eic_code`, or roll up with `bridge_area_hierarchy`.
    data_tests:
      - dlt_unique:
          name: mart_unavailability_unique_key
          arguments:
            columns: [timestamp_utc, mrid, source_code]
      - expression_is_true:
          name: mart_unavailability_coverage_in_range
          arguments:
            expression: "coverage > 0 and coverage <= 1"
    columns:
      - name: timestamp_utc
        description: "{{ doc('col_timestamp_utc') }}"
        data_tests: [not_null]
      - name: area_eic_code
        description: "{{ doc('col_area_eic_code') }}"
        data_tests:
          - relationships:
              name: mart_unavailability_known_area
              config:
                severity: warn
              arguments:
                to: ref('dim_area')
                field: area_eic_code
      - name: technology_code
        description: "{{ doc('col_technology_code') }}"
        data_tests:
          - relationships:
              name: mart_unavailability_known_technology
              arguments:
                to: ref('dim_technology')
                field: technology_code
      - name: resource_code
        description: "{{ doc('col_resource_code') }}"
        data_tests:
          - relationships:
              name: mart_unavailability_known_resource
              arguments:
                to: ref('dim_resource')
                field: resource_code
      - name: unavailable_capacity_mw
        description: "{{ doc('col_unavailable_capacity_mw') }}"
      - name: available_capacity_mw
        description: "{{ doc('col_available_capacity_mw') }}"
      - name: coverage
        description: "{{ doc('col_coverage') }}"
      - name: event_status
        description: "{{ doc('col_remit_event_status') }}"
      - name: event_type
        description: "{{ doc('col_remit_event_type') }}"
      - name: unavailability_type
        description: "{{ doc('col_remit_unavailability_type') }}"
      - name: mrid
        description: "{{ doc('col_remit_mrid') }}"
        data_tests: [not_null]
      - name: revision_number
        description: "{{ doc('col_remit_revision_number') }}"
      - name: source_dataset
        description: "{{ doc('col_source_dataset') }}"
      - name: source_code
        description: "{{ doc('col_source_code') }}"
      - name: publish_time_utc
        description: "{{ doc('col_publish_time_utc') }}"
      - name: _last_dlt_load_id
        description: "{{ doc('col__last_dlt_load_id') }}"
      - name: _dbt_invocation_id
        description: "{{ doc('col__dbt_invocation_id') }}"
      - name: _dbt_updated_at
        description: "{{ doc('col__dbt_updated_at') }}"
