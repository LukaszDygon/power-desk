# Entities: every source providing the entity at its published interval, every resolution published
# (overlaps are resolved by the hourly marts, most recently published first). Columns: keys (time,
# interval, area, technology, horizon), measures, provenance; GB settlement columns are null elsewhere.
models:
  - name: ods_generation_actual
    description: |
      Actual generation per area, technology and interval, across sources: GB at 5-minute grain
      (FUELINST fuel types plus PVLive solar), ENTSO-E areas per market time unit and production type.
      ENTSO-E publishes the same generation at several area levels.

      {{ doc('dataset_bmrs__fuelinst') }}

      {{ doc('dataset_pvlive__solar') }}

      {{ doc('dataset_entsoe__generation_per_type') }}
    data_tests:
      - dlt_unique:
          name: ods_generation_actual_unique_key
          arguments:
            columns: [timestamp_utc, interval_minutes, area_eic_code, source_dataset, source_code]
      - expression_is_true:
          name: ods_generation_actual_interconnector_has_border
          config:
            severity: warn
          arguments:
            expression: technology_code <> 'interconnector' or border_area_eic_code is not null
    columns:
      - name: timestamp_utc
        description: "{{ doc('col_timestamp_utc') }}"
        data_tests:
          - not_null
      - name: interval_minutes
        description: "{{ doc('col_interval_minutes') }}"
        data_tests:
          - not_null
      - name: area_eic_code
        description: "{{ doc('col_area_eic_code') }}"
        data_tests:
          - not_null
          - relationships:
              name: ods_generation_actual_known_area
              arguments:
                to: ref('dim_area')
                field: area_eic_code
      - name: technology_code
        description: "{{ doc('col_technology_code') }}"
        data_tests:
          - not_null:
              name: ods_generation_actual_technology_mapped
              config:
                severity: warn
          - relationships:
              name: ods_generation_actual_known_technology
              arguments:
                to: ref('dim_technology')
                field: technology_code
      - name: border_area_eic_code
        description: "{{ doc('col_border_area_eic_code') }}"
        data_tests:
          - relationships:
              name: ods_generation_actual_known_border_area
              arguments:
                to: ref('dim_border')
                field: border_area_eic_code
      - name: generation_mw
        description: "{{ doc('col_generation_mw') }}"
      - name: consumption_mw
        description: "{{ doc('col_consumption_mw') }}"
      - name: source_dataset
        description: "{{ doc('col_source_dataset') }}"
      - name: source_code
        description: "{{ doc('col_source_code') }}"
        data_tests:
          - not_null:
              name: ods_generation_actual_source_code_known
              config:
                severity: warn
      - name: settlement_date
        description: "{{ doc('col_settlement_date') }}"
      - name: settlement_period
        description: "{{ doc('col_settlement_period') }}"
      - name: publish_time_utc
        description: "{{ doc('col_publish_time_utc') }}"
      - name: _dlt_load_id
        description: "{{ doc('col__dlt_load_id') }}"

  - name: ods_generation_forecast
    description: |
      Generation forecasts per area, technology, horizon and interval, across sources: GB wind
      (WINDFOR, latest revision per hour), ENTSO-E wind and solar per market time unit, one row per
      published horizon.

      {{ doc('dataset_bmrs__windfor') }}

      {{ doc('dataset_entsoe__wind_solar_forecast') }}
    data_tests:
      - dlt_unique:
          name: ods_generation_forecast_unique_key
          arguments:
            columns: [timestamp_utc, interval_minutes, area_eic_code, source_dataset, source_code, time_horizon]
    columns:
      - name: timestamp_utc
        description: "{{ doc('col_timestamp_utc') }}"
        data_tests:
          - not_null
      - name: interval_minutes
        description: "{{ doc('col_interval_minutes') }}"
        data_tests:
          - not_null
      - name: area_eic_code
        description: "{{ doc('col_area_eic_code') }}"
        data_tests:
          - not_null
          - relationships:
              name: ods_generation_forecast_known_area
              arguments:
                to: ref('dim_area')
                field: area_eic_code
      - name: technology_code
        description: "{{ doc('col_technology_code') }}"
        data_tests:
          - not_null:
              name: ods_generation_forecast_technology_mapped
              config:
                severity: warn
          - relationships:
              name: ods_generation_forecast_known_technology
              arguments:
                to: ref('dim_technology')
                field: technology_code
      - name: time_horizon
        description: "{{ doc('col_time_horizon') }}"
        data_tests:
          - not_null
          - relationships:
              name: ods_generation_forecast_known_horizon
              arguments:
                to: ref('dim_time_horizon')
                field: time_horizon
      - name: generation_mw
        description: "{{ doc('col_generation_forecast_mw') }}"
      - name: source_dataset
        description: "{{ doc('col_source_dataset') }}"
      - name: source_code
        description: "{{ doc('col_source_code') }}"
      - name: publish_time_utc
        description: "{{ doc('col_publish_time_utc') }}"
      - name: _dlt_load_id
        description: "{{ doc('col__dlt_load_id') }}"

  - name: ods_demand_actual
    description: |
      Actual demand per area and interval, across sources: GB national demand per settlement period,
      ENTSO-E actual total load per market time unit.

      {{ doc('dataset_bmrs__indo') }}

      {{ doc('dataset_entsoe__actual_total_load') }}
    data_tests:
      - dlt_unique:
          name: ods_demand_actual_unique_key
          arguments:
            columns: [timestamp_utc, interval_minutes, area_eic_code, source_dataset]
    columns:
      - name: timestamp_utc
        description: "{{ doc('col_timestamp_utc') }}"
        data_tests:
          - not_null
      - name: interval_minutes
        description: "{{ doc('col_interval_minutes') }}"
        data_tests:
          - not_null
      - name: area_eic_code
        description: "{{ doc('col_area_eic_code') }}"
        data_tests:
          - not_null
          - relationships:
              name: ods_demand_actual_known_area
              arguments:
                to: ref('dim_area')
                field: area_eic_code
      - name: demand_mw
        description: "{{ doc('col_demand_mw') }}"
      - name: source_dataset
        description: "{{ doc('col_source_dataset') }}"
      - name: settlement_date
        description: "{{ doc('col_settlement_date') }}"
      - name: settlement_period
        description: "{{ doc('col_settlement_period') }}"
      - name: publish_time_utc
        description: "{{ doc('col_publish_time_utc') }}"
      - name: _dlt_load_id
        description: "{{ doc('col__dlt_load_id') }}"

  - name: ods_demand_forecast
    description: |
      Day-ahead demand forecast per area and interval, across sources: GB national demand forecast per
      settlement period, ENTSO-E day-ahead total load forecast per market time unit.

      {{ doc('dataset_bmrs__ndf') }}

      {{ doc('dataset_entsoe__day_ahead_total_load_forecast') }}
    data_tests:
      - dlt_unique:
          name: ods_demand_forecast_unique_key
          arguments:
            columns: [timestamp_utc, interval_minutes, area_eic_code, source_dataset, time_horizon]
    columns:
      - name: timestamp_utc
        description: "{{ doc('col_timestamp_utc') }}"
        data_tests:
          - not_null
      - name: interval_minutes
        description: "{{ doc('col_interval_minutes') }}"
        data_tests:
          - not_null
      - name: area_eic_code
        description: "{{ doc('col_area_eic_code') }}"
        data_tests:
          - not_null
          - relationships:
              name: ods_demand_forecast_known_area
              arguments:
                to: ref('dim_area')
                field: area_eic_code
      - name: time_horizon
        description: "{{ doc('col_time_horizon') }}"
        data_tests:
          - not_null
          - relationships:
              name: ods_demand_forecast_known_horizon
              arguments:
                to: ref('dim_time_horizon')
                field: time_horizon
      - name: demand_mw
        description: "{{ doc('col_forecast_demand_mw') }}"
      - name: source_dataset
        description: "{{ doc('col_source_dataset') }}"
      - name: settlement_date
        description: "{{ doc('col_settlement_date') }}"
      - name: settlement_period
        description: "{{ doc('col_settlement_period') }}"
      - name: publish_time_utc
        description: "{{ doc('col_publish_time_utc') }}"
      - name: _dlt_load_id
        description: "{{ doc('col__dlt_load_id') }}"

  - name: ods_transmission_demand_actual
    description: |
      Actual transmission system demand per settlement period (GB).

      {{ doc('dataset_bmrs__itsdo') }}
    data_tests:
      - dlt_unique:
          name: ods_transmission_demand_actual_unique_key
          arguments:
            columns: [timestamp_utc, area_eic_code, source_dataset]
    columns:
      - name: timestamp_utc
        description: "{{ doc('col_timestamp_utc') }}"
        data_tests:
          - not_null
      - name: interval_minutes
        description: "{{ doc('col_interval_minutes') }}"
        data_tests:
          - not_null
      - name: area_eic_code
        description: "{{ doc('col_area_eic_code') }}"
        data_tests:
          - not_null
          - relationships:
              name: ods_transmission_demand_actual_known_area
              arguments:
                to: ref('dim_area')
                field: area_eic_code
      - name: demand_mw
        description: "{{ doc('col_transmission_demand_mw') }}"
        data_tests:
          - not_null
      - name: source_dataset
        description: "{{ doc('col_source_dataset') }}"
      - name: settlement_date
        description: "{{ doc('col_settlement_date') }}"
      - name: settlement_period
        description: "{{ doc('col_settlement_period') }}"
      - name: publish_time_utc
        description: "{{ doc('col_publish_time_utc') }}"
      - name: _dlt_load_id
        description: "{{ doc('col__dlt_load_id') }}"

  - name: ods_energy_price
    description: |
      Electricity prices per area and interval, across sources: GB Market Index Data per settlement period
      and data provider, ENTSO-E energy prices per bidding zone, time horizon, classification sequence and
      market time unit.

      {{ doc('dataset_bmrs__mid') }}

      {{ doc('dataset_entsoe__energy_prices') }}
    config:
      meta:
        context:
          constraints:
            - Do not average or compare prices of different `currency` without converting them.
    data_tests:
      - dlt_unique:
          name: ods_energy_price_unique_key
          arguments:
            columns: [timestamp_utc, interval_minutes, area_eic_code, time_horizon, classification_sequence, source_dataset, source_code]
    columns:
      - name: timestamp_utc
        description: "{{ doc('col_timestamp_utc') }}"
        data_tests:
          - not_null
      - name: interval_minutes
        description: "{{ doc('col_interval_minutes') }}"
        data_tests:
          - not_null
      - name: area_eic_code
        description: "{{ doc('col_area_eic_code') }}"
        data_tests:
          - not_null
          - relationships:
              name: ods_energy_price_known_area
              arguments:
                to: ref('dim_area')
                field: area_eic_code
      - name: time_horizon
        description: "{{ doc('col_time_horizon') }}"
        data_tests:
          - relationships:
              name: ods_energy_price_known_horizon
              arguments:
                to: ref('dim_time_horizon')
                field: time_horizon
      - name: classification_sequence
        description: "{{ doc('col_classification_sequence') }}"
      - name: price_per_mwh
        description: "{{ doc('col_price_per_mwh') }}"
        data_tests:
          - not_null
      - name: currency
        description: "{{ doc('col_currency') }}"
        data_tests:
          - not_null
      - name: volume_mwh
        description: "{{ doc('col_volume_mwh') }}"
      - name: source_dataset
        description: "{{ doc('col_source_dataset') }}"
      - name: source_code
        description: "{{ doc('col_source_code') }}"
        data_tests:
          - not_null
      - name: settlement_date
        description: "{{ doc('col_settlement_date') }}"
      - name: settlement_period
        description: "{{ doc('col_settlement_period') }}"
      - name: publish_time_utc
        description: "{{ doc('col_publish_time_utc') }}"
      - name: _dlt_load_id
        description: "{{ doc('col__dlt_load_id') }}"

  - name: ods_transfer_capacity
    description: |
      Transfer capacity per oriented couple of areas, time horizon and interval, across sources: ENTSO-E
      forecasted transfer capacities (year-, month-, week- and day-ahead, every area level published) and
      NESO's restrictions per GB interconnector and auction, one row per direction. NESO's values are its
      input to the capacity calculation, not the final capacity offered.

      {{ doc('dataset_entsoe__forecasted_transfer_capacities') }}

      {{ doc('dataset_neso__ifa_ntc') }}
    data_tests:
      - dlt_unique:
          name: ods_transfer_capacity_unique_key
          arguments:
            columns: [timestamp_utc, interval_minutes, out_area_eic_code, in_area_eic_code, source_dataset, source_code]
      - expression_is_true:
          name: ods_transfer_capacity_neso_has_border
          arguments:
            expression: source_dataset not like 'NESO_%' or border_area_eic_code is not null
    columns:
      - name: timestamp_utc
        description: "{{ doc('col_timestamp_utc') }}"
        data_tests:
          - not_null
      - name: interval_minutes
        description: "{{ doc('col_interval_minutes') }}"
        data_tests:
          - not_null
      - name: out_area_eic_code
        description: "{{ doc('col_out_area_eic_code') }}"
        data_tests:
          - not_null
          - relationships:
              name: ods_transfer_capacity_known_out_area
              config:
                severity: warn
              arguments:
                to: ref('dim_area')
                field: area_eic_code
      - name: in_area_eic_code
        description: "{{ doc('col_in_area_eic_code') }}"
        data_tests:
          - not_null
          - relationships:
              name: ods_transfer_capacity_known_in_area
              config:
                severity: warn
              arguments:
                to: ref('dim_area')
                field: area_eic_code
      - name: border_area_eic_code
        description: "{{ doc('col_border_area_eic_code') }}"
        data_tests:
          - relationships:
              name: ods_transfer_capacity_known_border_area
              arguments:
                to: ref('dim_border')
                field: border_area_eic_code
      - name: time_horizon
        description: "{{ doc('col_time_horizon') }}"
        data_tests:
          - not_null
          - relationships:
              name: ods_transfer_capacity_known_horizon
              arguments:
                to: ref('dim_time_horizon')
                field: time_horizon
      - name: transfer_capacity_mw
        description: "{{ doc('col_transfer_capacity_mw') }}"
        data_tests:
          - not_null
      - name: restriction_reason
        description: "{{ doc('col_restriction_reason') }}"
      - name: source_dataset
        description: "{{ doc('col_source_dataset') }}"
      - name: source_code
        description: "{{ doc('col_source_code') }}"
      - name: publish_time_utc
        description: "{{ doc('col_publish_time_utc') }}"
      - name: _dlt_load_id
        description: "{{ doc('col__dlt_load_id') }}"

  - name: ods_unavailability
    description: |
      Unavailability of electricity facilities per published REMIT message (every revision) and interval: the
      outage profile's intervals where the message publishes one, else the whole event period. Grain: one row
      per `message_id` and `interval_index`. An event (`mrid`) is revised by new messages; only its latest
      revision (`is_latest_revision`) applies. Intervals start and end at any second (`interval_minutes` may
      be fractional), and an open-ended event has no `interval_minutes`.

      {{ doc('dataset_bmrs__remit') }}
    config:
      meta:
        context:
          instructions: >-
            For the unavailability as currently known, filter `is_latest_revision`; for what was known at a
            time T, take each event's latest revision with `publish_time_utc` <= T. For hourly figures, query
            `mart_unavailability` or `mart_gb_generation_unavailability`.
          constraints:
            - >-
              Do not sum across revisions of one event (`mrid`): each revision restates the event. Filter
              `is_latest_revision` (or the revision applicable at the time you need).
            - >-
              Exclude `event_status` = 'Dismissed' (events cancelled or withdrawn) when counting unavailable
              capacity.
            - >-
              Sum `unavailable_capacity_mw` across concurrent events, never `available_capacity_mw`: each event
              reports only the capacity it makes unavailable, but the facility's whole remaining capacity.
            - >-
              `resource_code` is null where the asset (`source_code`) is not a BM Unit in Elexon's list; group
              by `source_code` to keep those assets.
    data_tests:
      - dlt_unique:
          name: ods_unavailability_unique_key
          arguments:
            columns: [message_id, interval_index]
      - dlt_unique:
          name: ods_unavailability_one_latest_per_event_unit_interval
          config:
            where: is_latest_revision
          arguments:
            columns: [mrid, source_code, interval_index]
      - expression_is_true:
          name: ods_unavailability_interval_not_negative
          config:
            severity: warn
          arguments:
            expression: "interval_minutes is null or interval_minutes >= 0"
    columns:
      - name: timestamp_utc
        description: "{{ doc('col_timestamp_utc') }}"
        data_tests: [not_null]
      - name: interval_minutes
        description: "{{ doc('col_interval_minutes') }}"
      - name: area_eic_code
        description: "{{ doc('col_area_eic_code') }}"
        data_tests:
          - relationships:
              name: ods_unavailability_known_area
              config:
                severity: warn
              arguments:
                to: ref('dim_area')
                field: area_eic_code
      - name: technology_code
        description: "{{ doc('col_technology_code') }}"
        data_tests:
          - relationships:
              name: ods_unavailability_known_technology
              arguments:
                to: ref('dim_technology')
                field: technology_code
      - name: resource_code
        description: "{{ doc('col_resource_code') }}"
        data_tests:
          - not_null:
              name: ods_unavailability_resource_mapped
              config:
                severity: warn
                where: event_type = 'Production unavailability'
          - relationships:
              name: ods_unavailability_known_resource
              arguments:
                to: ref('dim_resource')
                field: resource_code
      - name: unavailable_capacity_mw
        description: "{{ doc('col_unavailable_capacity_mw') }}"
      - name: available_capacity_mw
        description: "{{ doc('col_available_capacity_mw') }}"
      - name: installed_capacity_mw
        description: "{{ doc('col_installed_capacity_mw') }}"
      - name: mrid
        description: "{{ doc('col_remit_mrid') }}"
        data_tests: [not_null]
      - name: revision_number
        description: "{{ doc('col_remit_revision_number') }}"
        data_tests: [not_null]
      - name: message_id
        description: "{{ doc('col_remit_message_id') }}"
        data_tests: [not_null]
      - name: interval_index
        description: "{{ doc('col_interval_index') }}"
      - name: is_latest_revision
        description: "{{ doc('col_remit_is_latest_revision') }}"
        data_tests: [not_null]
      - name: event_status
        description: "{{ doc('col_remit_event_status') }}"
        data_tests:
          - accepted_values:
              arguments:
                values: [Active, Inactive, Dismissed]
      - name: event_type
        description: "{{ doc('col_remit_event_type') }}"
      - name: unavailability_type
        description: "{{ doc('col_remit_unavailability_type') }}"
        data_tests:
          - accepted_values:
              arguments:
                values: [Planned, Unplanned]
      - name: event_start_utc
        description: "{{ doc('col_remit_event_start') }}"
      - name: event_end_utc
        description: "{{ doc('col_remit_event_stop') }}"
      - name: reason
        description: "{{ doc('col_remit_reason') }}"
      - name: affected_unit_eic
        description: "{{ doc('col_remit_affected_unit_eic') }}"
      - name: publish_time_utc
        description: "{{ doc('col_publish_time_utc') }}"
        data_tests: [not_null]
      - name: source_dataset
        description: "{{ doc('col_source_dataset') }}"
        data_tests:
          - relationships:
              name: ods_unavailability_known_source_dataset
              arguments:
                to: ref('dim_source_dataset')
                field: source_dataset
      - name: source_code
        description: "{{ doc('col_source_code') }}"
      - name: _dlt_load_id
        description: "{{ doc('col__dlt_load_id') }}"
