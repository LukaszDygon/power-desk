# Entities: every source providing the entity at its published interval, every resolution published
# (overlaps are resolved by the hourly marts, most recently published first). Columns: keys (time,
# interval, area, technology, horizon), measures, provenance; GB settlement columns are null elsewhere.
models:
  - name: ods_generation_actual
    description: |
      Actual generation per area, technology and interval, across sources: GB at 5-minute grain
      (FUELINST fuel types plus PVLive solar), ENTSO-E areas per market time unit and production type.
      ENTSO-E publishes the same generation at several area levels.

      {{ doc('dataset_bmrs__fuelinst') }}

      {{ doc('dataset_pvlive__solar') }}

      {{ doc('dataset_entsoe__generation_per_type') }}
    data_tests:
      - dlt_unique:
          name: ods_generation_actual_unique_key
          arguments:
            columns: [timestamp_utc, interval_minutes, area_eic_code, source_dataset, source_code]
      - expression_is_true:
          name: ods_generation_actual_interconnector_has_border
          config:
            severity: warn
          arguments:
            expression: technology_code <> 'interconnector' or border_area_eic_code is not null
    columns:
      - name: timestamp_utc
        description: "{{ doc('col_timestamp_utc') }}"
        data_tests:
          - not_null
      - name: interval_minutes
        description: "{{ doc('col_interval_minutes') }}"
        data_tests:
          - not_null
      - name: area_eic_code
        description: "{{ doc('col_area_eic_code') }}"
        data_tests:
          - not_null
          - relationships:
              name: ods_generation_actual_known_area
              arguments:
                to: ref('dim_area')
                field: area_eic_code
      - name: technology_code
        description: "{{ doc('col_technology_code') }}"
        data_tests:
          - not_null:
              name: ods_generation_actual_technology_mapped
              config:
                severity: warn
          - relationships:
              name: ods_generation_actual_known_technology
              arguments:
                to: ref('dim_technology')
                field: technology_code
      - name: border_area_eic_code
        description: "{{ doc('col_border_area_eic_code') }}"
        data_tests:
          - relationships:
              name: ods_generation_actual_known_border_area
              arguments:
                to: ref('dim_border')
                field: border_area_eic_code
      - name: generation_mw
        description: "{{ doc('col_generation_mw') }}"
      - name: consumption_mw
        description: "{{ doc('col_consumption_mw') }}"
      - name: source_dataset
        description: "{{ doc('col_source_dataset') }}"
      - name: source_code
        description: "{{ doc('col_source_code') }}"
        data_tests:
          - not_null:
              name: ods_generation_actual_source_code_known
              config:
                severity: warn
      - name: settlement_date
        description: "{{ doc('col_settlement_date') }}"
      - name: settlement_period
        description: "{{ doc('col_settlement_period') }}"
      - name: publish_time_utc
        description: "{{ doc('col_publish_time_utc') }}"
      - name: _dlt_load_id
        description: "{{ doc('col__dlt_load_id') }}"

  - name: ods_generation_forecast
    description: |
      Generation forecasts per area, technology, horizon and interval, across sources: GB wind
      (WINDFOR, latest revision per hour), ENTSO-E wind and solar per market time unit, one row per
      published horizon.

      {{ doc('dataset_bmrs__windfor') }}

      {{ doc('dataset_entsoe__wind_solar_forecast') }}
    data_tests:
      - dlt_unique:
          name: ods_generation_forecast_unique_key
          arguments:
            columns: [timestamp_utc, interval_minutes, area_eic_code, source_dataset, source_code, time_horizon]
    columns:
      - name: timestamp_utc
        description: "{{ doc('col_timestamp_utc') }}"
        data_tests:
          - not_null
      - name: interval_minutes
        description: "{{ doc('col_interval_minutes') }}"
        data_tests:
          - not_null
      - name: area_eic_code
        description: "{{ doc('col_area_eic_code') }}"
        data_tests:
          - not_null
          - relationships:
              name: ods_generation_forecast_known_area
              arguments:
                to: ref('dim_area')
                field: area_eic_code
      - name: technology_code
        description: "{{ doc('col_technology_code') }}"
        data_tests:
          - not_null:
              name: ods_generation_forecast_technology_mapped
              config:
                severity: warn
          - relationships:
              name: ods_generation_forecast_known_technology
              arguments:
                to: ref('dim_technology')
                field: technology_code
      - name: time_horizon
        description: "{{ doc('col_time_horizon') }}"
        data_tests:
          - not_null
          - relationships:
              name: ods_generation_forecast_known_horizon
              arguments:
                to: ref('dim_time_horizon')
                field: time_horizon
      - name: generation_mw
        description: "{{ doc('col_generation_forecast_mw') }}"
      - name: source_dataset
        description: "{{ doc('col_source_dataset') }}"
      - name: source_code
        description: "{{ doc('col_source_code') }}"
      - name: publish_time_utc
        description: "{{ doc('col_publish_time_utc') }}"
      - name: _dlt_load_id
        description: "{{ doc('col__dlt_load_id') }}"

  - name: ods_demand_actual
    description: |
      Actual demand per area and interval, across sources: GB national demand per settlement period,
      ENTSO-E actual total load per market time unit.

      {{ doc('dataset_bmrs__indo') }}

      {{ doc('dataset_entsoe__actual_total_load') }}
    data_tests:
      - dlt_unique:
          name: ods_demand_actual_unique_key
          arguments:
            columns: [timestamp_utc, interval_minutes, area_eic_code, source_dataset]
    columns:
      - name: timestamp_utc
        description: "{{ doc('col_timestamp_utc') }}"
        data_tests:
          - not_null
      - name: interval_minutes
        description: "{{ doc('col_interval_minutes') }}"
        data_tests:
          - not_null
      - name: area_eic_code
        description: "{{ doc('col_area_eic_code') }}"
        data_tests:
          - not_null
          - relationships:
              name: ods_demand_actual_known_area
              arguments:
                to: ref('dim_area')
                field: area_eic_code
      - name: demand_mw
        description: "{{ doc('col_demand_mw') }}"
      - name: source_dataset
        description: "{{ doc('col_source_dataset') }}"
      - name: settlement_date
        description: "{{ doc('col_settlement_date') }}"
      - name: settlement_period
        description: "{{ doc('col_settlement_period') }}"
      - name: publish_time_utc
        description: "{{ doc('col_publish_time_utc') }}"
      - name: _dlt_load_id
        description: "{{ doc('col__dlt_load_id') }}"

  - name: ods_demand_forecast
    description: |
      Day-ahead demand forecast per area and interval, across sources: GB national demand forecast per
      settlement period, ENTSO-E day-ahead total load forecast per market time unit.

      {{ doc('dataset_bmrs__ndf') }}

      {{ doc('dataset_entsoe__day_ahead_total_load_forecast') }}
    data_tests:
      - dlt_unique:
          name: ods_demand_forecast_unique_key
          arguments:
            columns: [timestamp_utc, interval_minutes, area_eic_code, source_dataset, time_horizon]
    columns:
      - name: timestamp_utc
        description: "{{ doc('col_timestamp_utc') }}"
        data_tests:
          - not_null
      - name: interval_minutes
        description: "{{ doc('col_interval_minutes') }}"
        data_tests:
          - not_null
      - name: area_eic_code
        description: "{{ doc('col_area_eic_code') }}"
        data_tests:
          - not_null
          - relationships:
              name: ods_demand_forecast_known_area
              arguments:
                to: ref('dim_area')
                field: area_eic_code
      - name: time_horizon
        description: "{{ doc('col_time_horizon') }}"
        data_tests:
          - not_null
          - relationships:
              name: ods_demand_forecast_known_horizon
              arguments:
                to: ref('dim_time_horizon')
                field: time_horizon
      - name: demand_mw
        description: "{{ doc('col_forecast_demand_mw') }}"
      - name: source_dataset
        description: "{{ doc('col_source_dataset') }}"
      - name: settlement_date
        description: "{{ doc('col_settlement_date') }}"
      - name: settlement_period
        description: "{{ doc('col_settlement_period') }}"
      - name: publish_time_utc
        description: "{{ doc('col_publish_time_utc') }}"
      - name: _dlt_load_id
        description: "{{ doc('col__dlt_load_id') }}"

  - name: ods_transmission_demand_actual
    description: |
      Actual transmission system demand per settlement period (GB).

      {{ doc('dataset_bmrs__itsdo') }}
    data_tests:
      - dlt_unique:
          name: ods_transmission_demand_actual_unique_key
          arguments:
            columns: [timestamp_utc, area_eic_code, source_dataset]
    columns:
      - name: timestamp_utc
        description: "{{ doc('col_timestamp_utc') }}"
        data_tests:
          - not_null
      - name: interval_minutes
        description: "{{ doc('col_interval_minutes') }}"
        data_tests:
          - not_null
      - name: area_eic_code
        description: "{{ doc('col_area_eic_code') }}"
        data_tests:
          - not_null
          - relationships:
              name: ods_transmission_demand_actual_known_area
              arguments:
                to: ref('dim_area')
                field: area_eic_code
      - name: demand_mw
        description: "{{ doc('col_transmission_demand_mw') }}"
        data_tests:
          - not_null
      - name: source_dataset
        description: "{{ doc('col_source_dataset') }}"
      - name: settlement_date
        description: "{{ doc('col_settlement_date') }}"
      - name: settlement_period
        description: "{{ doc('col_settlement_period') }}"
      - name: publish_time_utc
        description: "{{ doc('col_publish_time_utc') }}"
      - name: _dlt_load_id
        description: "{{ doc('col__dlt_load_id') }}"

  - name: ods_energy_price
    description: |
      Electricity prices per area and interval, across sources: GB Market Index Data per settlement period
      and data provider, ENTSO-E energy prices per bidding zone, time horizon, classification sequence and
      market time unit.

      {{ doc('dataset_bmrs__mid') }}

      {{ doc('dataset_entsoe__energy_prices') }}
    data_tests:
      - dlt_unique:
          name: ods_energy_price_unique_key
          arguments:
            columns: [timestamp_utc, interval_minutes, area_eic_code, time_horizon, classification_sequence, source_dataset, source_code]
    columns:
      - name: timestamp_utc
        description: "{{ doc('col_timestamp_utc') }}"
        data_tests:
          - not_null
      - name: interval_minutes
        description: "{{ doc('col_interval_minutes') }}"
        data_tests:
          - not_null
      - name: area_eic_code
        description: "{{ doc('col_area_eic_code') }}"
        data_tests:
          - not_null
          - relationships:
              name: ods_energy_price_known_area
              arguments:
                to: ref('dim_area')
                field: area_eic_code
      - name: time_horizon
        description: "{{ doc('col_time_horizon') }}"
        data_tests:
          - relationships:
              name: ods_energy_price_known_horizon
              arguments:
                to: ref('dim_time_horizon')
                field: time_horizon
      - name: classification_sequence
        description: "{{ doc('col_classification_sequence') }}"
      - name: price_per_mwh
        description: "{{ doc('col_price_per_mwh') }}"
        data_tests:
          - not_null
      - name: currency
        description: "{{ doc('col_currency') }}"
        data_tests:
          - not_null
      - name: volume_mwh
        description: "{{ doc('col_volume_mwh') }}"
      - name: source_dataset
        description: "{{ doc('col_source_dataset') }}"
      - name: source_code
        description: "{{ doc('col_source_code') }}"
        data_tests:
          - not_null
      - name: settlement_date
        description: "{{ doc('col_settlement_date') }}"
      - name: settlement_period
        description: "{{ doc('col_settlement_period') }}"
      - name: publish_time_utc
        description: "{{ doc('col_publish_time_utc') }}"
      - name: _dlt_load_id
        description: "{{ doc('col__dlt_load_id') }}"

  - name: ods_transfer_capacity
    description: |
      Transfer capacity per oriented couple of areas, time horizon and interval, across sources: ENTSO-E
      forecasted transfer capacities (year-, month-, week- and day-ahead, every area level published) and
      NESO's restrictions per GB interconnector and auction, one row per direction. NESO's values are its
      input to the capacity calculation, not the final capacity offered.

      {{ doc('dataset_entsoe__forecasted_transfer_capacities') }}

      {{ doc('dataset_neso__ifa_ntc') }}
    data_tests:
      - dlt_unique:
          name: ods_transfer_capacity_unique_key
          arguments:
            columns: [timestamp_utc, interval_minutes, out_area_eic_code, in_area_eic_code, source_dataset, source_code]
      - expression_is_true:
          name: ods_transfer_capacity_neso_has_border
          arguments:
            expression: source_dataset not like 'NESO_%' or border_area_eic_code is not null
    columns:
      - name: timestamp_utc
        description: "{{ doc('col_timestamp_utc') }}"
        data_tests:
          - not_null
      - name: interval_minutes
        description: "{{ doc('col_interval_minutes') }}"
        data_tests:
          - not_null
      - name: out_area_eic_code
        description: "{{ doc('col_out_area_eic_code') }}"
        data_tests:
          - not_null
          - relationships:
              name: ods_transfer_capacity_known_out_area
              config:
                severity: warn
              arguments:
                to: ref('dim_area')
                field: area_eic_code
      - name: in_area_eic_code
        description: "{{ doc('col_in_area_eic_code') }}"
        data_tests:
          - not_null
          - relationships:
              name: ods_transfer_capacity_known_in_area
              config:
                severity: warn
              arguments:
                to: ref('dim_area')
                field: area_eic_code
      - name: border_area_eic_code
        description: "{{ doc('col_border_area_eic_code') }}"
        data_tests:
          - relationships:
              name: ods_transfer_capacity_known_border_area
              arguments:
                to: ref('dim_border')
                field: border_area_eic_code
      - name: time_horizon
        description: "{{ doc('col_time_horizon') }}"
        data_tests:
          - not_null
          - relationships:
              name: ods_transfer_capacity_known_horizon
              arguments:
                to: ref('dim_time_horizon')
                field: time_horizon
      - name: transfer_capacity_mw
        description: "{{ doc('col_transfer_capacity_mw') }}"
        data_tests:
          - not_null
      - name: restriction_reason
        description: "{{ doc('col_restriction_reason') }}"
      - name: source_dataset
        description: "{{ doc('col_source_dataset') }}"
      - name: source_code
        description: "{{ doc('col_source_code') }}"
      - name: publish_time_utc
        description: "{{ doc('col_publish_time_utc') }}"
      - name: _dlt_load_id
        description: "{{ doc('col__dlt_load_id') }}"
