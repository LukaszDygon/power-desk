# GENERATED by `python -m power_desk_elt.catalog.generate` from ingest/schemas/ecmwf.schema.yaml - do not edit.
sources:
- name: ecmwf
  description: 'ECMWF open data, loaded by the `ecmwf` dlt pipeline from the open-data portal: eight surface fields of each
    forecast run at the grid points nearest to the sites selected in `dim_site` (operational wind and solar sites of the REPD),
    as published; each table keeps the versions of its rows (scd2) merged on the natural key (run, step, parameter and grid
    point).'
  schema: raw
  tables:
  - name: ecmwf__ifs_oper
    description: '{{ doc(''dataset_ecmwf__ifs_oper'') }}'
    config:
      meta:
        dagster:
          asset_key:
          - raw
          - ecmwf__ifs_oper
        dlt:
          pipeline: ecmwf
          resource: ecmwf__ifs_oper
          write_disposition: merge
          merge_strategy: scd2
          primary_key:
          - data_date
          - data_time
          - step_range
          - short_name
          - latitude
          - longitude
          cursor_column: data_date
        dlt_recent_column: _dlt_load_id
        references:
        - title: "ECMWF IFS medium-range forecast (atmosphere), 0.25\xB0"
          url: https://www.ecmwf.int/en/forecasts/datasets/open-data
        - title: ECMWF Open Data
          url: https://www.ecmwf.int/en/forecasts/datasets/open-data
      loaded_at_field: to_timestamp(cast(_dlt_load_id as double))
      freshness:
        warn_after:
          count: 14
          period: hour
        error_after:
          count: 26
          period: hour
    data_tests:
    - dlt_unique:
        name: ecmwf__ifs_oper_unique_natural_key
        arguments:
          columns:
          - data_date
          - data_time
          - step_range
          - short_name
          - latitude
          - longitude
          - _dlt_valid_to
    - dlt_unique:
        name: ecmwf__ifs_oper_unique_row_version
        arguments:
          columns:
          - _dlt_id
          - _dlt_valid_from
    columns:
    - name: _dlt_valid_from
      description: '{{ doc(''col__dlt_valid_from'') }}'
      config:
        meta:
          dlt_data_type: TIMESTAMP WITH TIME ZONE
    - name: _dlt_valid_to
      description: '{{ doc(''col__dlt_valid_to'') }}'
      config:
        meta:
          dlt_data_type: TIMESTAMP WITH TIME ZONE
    - name: data_date
      description: '{{ doc(''col_data_date'') }}'
      config:
        meta:
          dlt_data_type: BIGINT
          references:
          - title: Edition independent ecCodes keys, time
            url: https://codes.ecmwf.int/grib/format/edition-independent/2/
            section: dataDate
      data_tests:
      - not_null
    - name: data_time
      description: '{{ doc(''col_data_time'') }}'
      config:
        meta:
          dlt_data_type: BIGINT
          references:
          - title: Edition independent ecCodes keys, time
