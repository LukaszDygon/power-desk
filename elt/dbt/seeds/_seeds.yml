# Curated reference data. A seed named `dim_*` is itself a conformed dimension (no model copies it); the
# others are inputs of the dimension models (seeds/dims) or mappings of publisher codes (seeds/mappings).
seeds:
  - name: dim_technology
    description: |
      Canonical technologies, a tree from broad groups to specific technologies.
    config:
      column_types:
        is_zero_carbon: boolean
    data_tests:
      - dlt_unique:
          name: dim_technology_unique
          arguments:
            columns: [technology_code]
    columns:
      - name: technology_code
        description: "{{ doc('col_technology_code') }}"
      - name: name
        description: "{{ doc('col_name') }}"
      - name: parent_technology_code
        description: "{{ doc('col_parent_technology_code') }}"
        data_tests:
          - relationships:
              name: dim_technology_known_parent
              arguments:
                to: ref('dim_technology')
                field: technology_code
      - name: is_zero_carbon
        description: "{{ doc('col_is_zero_carbon') }}"

  - name: dim_time_horizon
    description: |
      Time horizons shared by forecasts, prices and capacities: day-, week-, month- and year-ahead,
      intraday (ENTSO-E process types) and the current forecast. Publisher codes map onto them in
      `map_time_horizon`.
    data_tests:
      - dlt_unique:
          name: dim_time_horizon_unique
          arguments:
            columns: [time_horizon]
    columns:
      - name: time_horizon
        description: "{{ doc('col_time_horizon') }}"
      - name: name
        description: "{{ doc('col_name') }}"
      - name: entsoe_process_type
        description: "{{ doc('col_entsoe_process_type') }}"
      - name: description
        description: "{{ doc('col_description') }}"

  - name: dim_metric
    description: |
      Measures of the entities and hourly marts: unit, and the hourly aggregation, which `hourly_series`
      applies to every entity column listed here: `mean`, the time-weighted mean over the minutes holding
      data; `sum`, the volume pro-rated into the hour.
    data_tests:
      - dlt_unique:
          name: dim_metric_unique
          arguments:
            columns: [metric]
    columns:
      - name: metric
        description: "{{ doc('col_metric') }}"
      - name: unit
        description: "{{ doc('col_unit') }}"
      - name: hourly_aggregation
        description: "{{ doc('col_hourly_aggregation') }}"
        data_tests:
          - accepted_values:
              arguments:
                values: [mean, sum]

  - name: eic_code_types
    description: |
      EIC object types.
    data_tests:
      - dlt_unique:
          name: eic_code_types_unique
          arguments:
            columns: [eic_type]
    columns:
      - name: eic_type
        description: "{{ doc('col_eic_type') }}"
      - name: name
        description: "{{ doc('col_name') }}"
      - name: description
        description: "{{ doc('col_description') }}"

  - name: nonconforming_eic_codes
    description: |
      Codes that publishers use as EICs but that do not conform to the EIC scheme (not allocated by an
      issuing office, e.g. an invalid check character), accepted after review and read as the registered
      code each stands for. `dim_eic_code` adds them to ENTSO-E's registry, separately identifiable by
      `registered_eic_code`.
    data_tests:
      - dlt_unique:
          name: nonconforming_eic_codes_unique
          arguments:
            columns: [eic_code]
    columns:
      - name: eic_code
        description: "{{ doc('col_eic_code') }}"
      - name: eic_type
        description: "{{ doc('col_eic_type') }}"
        data_tests:
          - relationships:
              name: nonconforming_eic_codes_known_type
              arguments:
                to: ref('eic_code_types')
                field: eic_type
      - name: registered_eic_code
        description: "{{ doc('col_registered_eic_code') }}"
        data_tests:
          - not_null
          - relationships:
              name: nonconforming_eic_codes_registered
              arguments:
                to: ref('stg_entsoe_eic__codes')
                field: eic_code
      - name: source_dataset
        description: "{{ doc('col_source_dataset') }}"
        data_tests:
          - relationships:
              name: nonconforming_eic_codes_known_dataset
              arguments:
                to: ref('dim_source_dataset')
                field: source_dataset
      - name: nonconformity
        description: "{{ doc('col_nonconformity') }}"
      - name: explanation
        description: "{{ doc('col_explanation') }}"

  - name: area_hierarchy
    description: |
      Curated containment links between areas where EIC publishes no parent.
    data_tests:
      - dlt_unique:
          name: area_hierarchy_unique
          arguments:
            columns: [child_area_eic_code, parent_area_eic_code]
    columns:
      - name: child_area_eic_code
        description: "{{ doc('col_child_area_eic_code') }}"
        data_tests:
          - relationships:
              name: area_hierarchy_known_child
              arguments:
                to: ref('dim_area')
                field: area_eic_code
      - name: parent_area_eic_code
        description: "{{ doc('col_parent_area_eic_code') }}"
        data_tests:
          - relationships:
              name: area_hierarchy_known_parent
              arguments:
                to: ref('dim_area')
                field: area_eic_code
      - name: relation
        description: "{{ doc('col_relation') }}"
      - name: notes
        description: "{{ doc('col_notes') }}"

  - name: border_endpoints
    description: |
      Areas on each side of a border area.
    data_tests:
      - dlt_unique:
          name: border_endpoints_unique
          arguments:
            columns: [border_area_eic_code]
    columns:
      - name: border_area_eic_code
        description: "{{ doc('col_border_area_eic_code') }}"
        data_tests:
          - relationships:
              name: border_endpoints_known_border
              arguments:
                to: ref('dim_area')
                field: area_eic_code
      - name: area_from_eic_code
        description: "{{ doc('col_area_from_eic_code') }}"
        data_tests:
          - relationships:
              name: border_endpoints_known_from_area
              arguments:
                to: ref('dim_area')
                field: area_eic_code
      - name: area_to_eic_code
        description: "{{ doc('col_area_to_eic_code') }}"
        data_tests:
          - relationships:
              name: border_endpoints_known_to_area
              arguments:
                to: ref('dim_area')
                field: area_eic_code
      - name: interconnector
        description: "{{ doc('col_interconnector') }}"
      - name: is_hvdc
        description: "{{ doc('col_is_hvdc') }}"

  - name: dim_source_dataset
    description: |
      Published datasets and code lists, with the entity they feed, native grain and default area.
    data_tests:
      - dlt_unique:
          name: dim_source_dataset_unique
          arguments:
            columns: [source_dataset]
    columns:
      - name: source_dataset
        description: "{{ doc('col_source_dataset') }}"
      - name: source
        description: "{{ doc('col_source') }}"
      - name: kind
        description: "{{ doc('col_kind') }}"
      - name: publisher
        description: "{{ doc('col_publisher') }}"
      - name: entity
        description: "{{ doc('col_entity') }}"
      - name: native_interval_minutes
        description: "{{ doc('col_native_interval_minutes') }}"
      - name: default_area_eic_code
        description: "{{ doc('col_default_area_eic_code') }}"
        data_tests:
          - relationships:
              name: dim_source_dataset_known_area
              arguments:
                to: ref('dim_area')
                field: area_eic_code

  - name: map_technology
    description: |
      Publisher technology codes mapped onto canonical technologies.
    data_tests:
      - dlt_unique:
          name: map_technology_unique
          arguments:
            columns: [source_dataset, source_code]
    columns:
      - name: source_dataset
        description: "{{ doc('col_source_dataset') }}"
        data_tests:
          - relationships:
              name: map_technology_known_dataset
              arguments:
                to: ref('dim_source_dataset')
                field: source_dataset
      - name: source_code
        description: "{{ doc('col_source_code') }}"
      - name: technology_code
        description: "{{ doc('col_technology_code') }}"
        data_tests:
          - relationships:
              name: map_technology_known_technology
              arguments:
                to: ref('dim_technology')
                field: technology_code
      - name: expected_every_period
        description: "{{ doc('col_expected_every_period') }}"
      - name: notes
        description: "{{ doc('col_notes') }}"

  - name: map_time_horizon
    description: |
      Publisher time-horizon codes (ENTSO-E contract types, NESO auction types, ENTSO-E forecast columns)
      mapped onto time horizons; `*`: every row of a dataset published for one horizon.
    data_tests:
      - dlt_unique:
          name: map_time_horizon_unique
          arguments:
            columns: [source_dataset, source_code]
    columns:
      - name: source_dataset
        description: "{{ doc('col_source_dataset') }}"
        data_tests:
          - relationships:
              name: map_time_horizon_known_dataset
              arguments:
                to: ref('dim_source_dataset')
                field: source_dataset
      - name: source_code
        description: "{{ doc('col_source_code') }}"
      - name: time_horizon
        description: "{{ doc('col_time_horizon') }}"
        data_tests:
          - relationships:
              name: map_time_horizon_known_horizon
              arguments:
                to: ref('dim_time_horizon')
                field: time_horizon
      - name: notes
        description: "{{ doc('col_notes') }}"

  - name: map_border
    description: |
      Publisher interconnector codes mapped onto border areas.
    data_tests:
      - dlt_unique:
          name: map_border_unique
          arguments:
            columns: [source_dataset, source_code]
    columns:
      - name: source_dataset
        description: "{{ doc('col_source_dataset') }}"
        data_tests:
          - relationships:
              name: map_border_known_dataset
              arguments:
                to: ref('dim_source_dataset')
                field: source_dataset
      - name: source_code
        description: "{{ doc('col_source_code') }}"
      - name: border_area_eic_code
        description: "{{ doc('col_border_area_eic_code') }}"
        data_tests:
          - relationships:
              name: map_border_known_border
              arguments:
                to: ref('dim_area')
                field: area_eic_code
      - name: notes
        description: "{{ doc('col_notes') }}"

  - name: map_area
    description: |
      Publisher location codes (REPD `Country`) mapped onto areas.
    data_tests:
      - dlt_unique:
          name: map_area_unique
          arguments:
            columns: [source_dataset, source_code]
    columns:
      - name: source_dataset
        description: "{{ doc('col_source_dataset') }}"
        data_tests:
          - relationships:
              name: map_area_known_dataset
              arguments:
                to: ref('dim_source_dataset')
                field: source_dataset
      - name: source_code
        description: "{{ doc('col_source_code') }}"
      - name: area_eic_code
        description: "{{ doc('col_area_eic_code') }}"
        data_tests:
          - relationships:
              name: map_area_known_area
              arguments:
                to: ref('dim_area')
                field: area_eic_code
      - name: notes
        description: "{{ doc('col_notes') }}"

  - name: entsoe_psr_types
    description: |
      ENTSO-E PsrType code list (production types): the name the Transparency Platform displays and
      the code list definition. Translates published production type names into the codes that
      `map_technology` maps (`source_dataset = 'ENTSOE_PSR'`), through the macro `entsoe_psr_type`.
    data_tests:
      - dlt_unique:
          name: entsoe_psr_types_unique_code
          arguments:
            columns: [psr_type]
      - dlt_unique:
          name: entsoe_psr_types_unique_name
          arguments:
            columns: [production_type]
    columns:
      - name: psr_type
        description: "{{ doc('col_psr_type') }}"
        data_tests:
          - relationships:
              name: entsoe_psr_types_mapped
              arguments:
                to: ref('map_technology')
                field: source_code
      - name: production_type
        description: "{{ doc('col_production_type') }}"
      - name: definition
        description: "{{ doc('col_psr_definition') }}"
