# Source `bmrs` (Elexon Insights API): dbt source, raw tables and BMRS-specific fields.
links:
  bsc_section_t:
    title: Balancing and Settlement Code, Section T Settlement and Trading Charges
    url: https://bscdocs.elexon.co.uk/bsc/bsc-section-t-settlement-and-trading-charges
sources:
  bmrs:
    description: Elexon Insights Solution (BMRS) datasets, loaded by the `bmrs` dlt pipeline.
tables:
  bmrs__fuelinst:
    refs:
    - elexon:datasets/FUELINST
    - elexon:glossary/instantaneous-generation-by-fuel-type
    freshness: actuals
    columns:
      generation: fuelinst_generation
  bmrs__indo:
    refs:
    - elexon:datasets/INDO
    - elexon:glossary/initial-national-demand-out-turn
    freshness: actuals
    columns:
      demand: indo_demand
  bmrs__itsdo:
    refs:
    - elexon:datasets/ITSDO
    - elexon:glossary/initial-transmission-system-demand-out-turn
    freshness: actuals
    columns:
      demand: itsdo_demand
  bmrs__ndf:
    refs:
    - elexon:datasets/NDF
    - elexon:glossary/national-demand-forecast
    freshness: forecasts
    columns:
      demand: ndf_demand
  bmrs__windfor:
    refs:
    - elexon:datasets/WINDFOR
    - elexon:glossary/wind-generation-forecast
    freshness: forecasts
    columns:
      generation: windfor_generation
      start_time: windfor_start_time
  bmrs__mid:
    refs:
    - elexon:datasets/MID
    - elexon:glossary/market-index-data
    freshness: actuals
    columns:
      price: mid_price
      volume: mid_volume
columns:
  dataset:
    description: Elexon dataset code of the record (e.g. `FUELINST`, `INDO`).
  publish_time:
    description: 'Time Elexon published the record (UTC). dlt incremental cursor: each run resumes from
      the latest value seen.'
  start_time:
    description: 'Start of the interval the value applies to (UTC): the 5-minute interval for FUELINST,
      the settlement period for INDO, ITSDO, NDF and MID. MID publishes no publish time, so this is its
      dlt incremental cursor.'
    refs:
    - elexon:glossary/spot-time
  windfor_start_time:
    description: Start of the forecast hour (UTC).
  boundary:
    description: Forecast boundary; `N` = national (the only boundary used downstream).
  fuelinst_generation:
    description: Average generation over the 5-minute interval for the fuel type, in MW.
    refs:
    - elexon:glossary/instantaneous-generation-by-fuel-type
  indo_demand:
    description: Initial National Demand Outturn for the settlement period, in MW (half-hour average).
    refs:
    - elexon:glossary/initial-national-demand-out-turn
  itsdo_demand:
    description: Initial Transmission System Demand Outturn for the settlement period, in MW (half-hour
      average).
    refs:
    - elexon:glossary/initial-transmission-system-demand-out-turn
  ndf_demand:
    description: National Demand Forecast for the settlement period, in MW (average).
    refs:
    - elexon:glossary/national-demand-forecast
  windfor_generation:
    description: Forecast wind generation for the hour, in MW.
    refs:
    - elexon:glossary/wind-generation-forecast
  data_provider:
    description: Market Index Data Provider whose market the record reflects, `APXMIDP` (APX) or `N2EXMIDP`
      (N2EX).
    refs:
    - elexon:glossary/market-index-data-provider
    - elexon:datasets/MID
  mid_price:
    description: Market Index Price for the settlement period, in GBP/MWh. Settlement derives the Market
      Price from it, weighted by the Market Index Volume.
    refs:
    - elexon:glossary/market-index-price
    - elexon:glossary/market-index-data
    links: [{link: bsc_section_t, section: 1.5.3(a)}]
  mid_volume:
    description: Market Index Volume for the settlement period, in MWh. Zero when the volume the provider
      would otherwise submit is below its Individual Liquidity Threshold.
    refs:
    - elexon:glossary/market-index-volume
    links: [{link: bsc_section_t, section: 1.6.3}]
