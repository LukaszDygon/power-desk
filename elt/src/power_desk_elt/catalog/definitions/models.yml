# Entity (ods), mart and reference-data columns. Shared across sources: an entity column
# keeps one meaning whichever source feeds it.
columns:
  generation_mw:
    description: Net generation for the technology over the interval, in MW (mean of the interval).
      FUELINST 5-minute averages; PVLive half-hourly estimates; ENTSO-E aggregated net generation output
      per market time unit.
  consumption_mw:
    description: Power absorbed over the interval, in MW, where published separately (ENTSO-E pumped
      storage and energy storage); null otherwise. Total load already deducts it.
    links: [entsoe_ddd]
  demand_mw:
    description: Actual demand over the interval, in MW. GB, Initial National Demand Outturn (excludes
      station load, pumping and exports); ENTSO-E areas, actual total load (net generation + imports -
      exports - absorbed energy, including losses). The definitions differ; compare within one source.
    refs:
    - elexon:glossary/initial-national-demand-out-turn
    links: [entsoe_ddd]
  transmission_demand_mw:
    description: Initial Transmission System Demand Outturn for the settlement period, in MW (national
      demand plus station load, pumping and exports).
    refs:
    - elexon:glossary/initial-transmission-system-demand-out-turn
  forecast_demand_mw:
    description: Latest day-ahead demand forecast for the interval, in MW. GB, National Demand Forecast
      (same scope as Initial National Demand Outturn); ENTSO-E areas, day-ahead total load forecast
      (updated on changes of at least 10%).
    refs:
    - elexon:glossary/national-demand-forecast
    links: [entsoe_ddd]
  time_horizon:
    description: "Time horizon of the value (`dim_time_horizon`), one vocabulary for forecasts, prices and
      capacities. Forecasts: `day_ahead` (made the day before delivery: ENTSO-E fixed at 18:00 Brussels time
      for wind and solar, latest day-ahead update for load; Elexon NDF), `intraday` (ENTSO-E, fixed at 08:00
      on the day) or `current` (the latest published revision: ENTSO-E current forecast, Elexon WINDFOR).
      Prices: the ENTSO-E contract type, `day_ahead` or `intraday`; null for Elexon MID, which reflects the
      GB short-term markets for delivery in the settlement period. Capacities: `day_ahead`, `week_ahead`,
      `month_ahead`, `year_ahead` (ENTSO-E contract type) or the NESO auction, `day_ahead` or `intraday`
      (the auction round is the `source_code`)."
    refs:
    - elexon:glossary/market-index-data
    links:
    - entsoe_ddd
    - {link: entsoe_codelist, section: 2.26 ProcessType enumeration, page: 45}
    - {link: entsoe_brs, section: 7.22.1 Data description, page: 128}
    - entsoe_extract_forecasted_transfer_capacities
    - neso_nsl
  classification_sequence:
    description: ENTSO-E classification sequence (round), distinguishing allocations with identical delivery
      periods; null where it does not apply, and for Elexon MID.
    links: [{link: entsoe_brs, section: 7.22.1 Data description, page: 128}]
  price_per_mwh:
    description: Price of electricity for the interval, in `currency` per MWh. ENTSO-E, the energy price of
      the bidding zone for the time horizon; Elexon MID, the Market Index Price of the data provider, from
      which settlement derives the Market Price weighted by the Market Index Volume (`volume_mwh`).
    refs:
    - elexon:glossary/market-index-price
    links: [entsoe_ddd, {link: bsc_section_t, section: 1.5.3(a)}]
  volume_mwh:
    description: Volume behind the price, in MWh. Elexon MID, the Market Index Volume, zero when below the
      provider's Individual Liquidity Threshold; null for ENTSO-E energy prices, which publish none.
    refs:
    - elexon:glossary/market-index-volume
    links: [{link: bsc_section_t, section: 1.6.3}]
  generation_forecast_mw:
    description: Forecast generation for the technology over the interval, in MW.
    refs:
    - elexon:glossary/wind-generation-forecast
    links: [entsoe_ddd]
  out_area_eic_code:
    description: EIC of the area flows come out from (the out area of an oriented couple of areas).
    links: [{link: entsoe_brs, section: 7.4.1 Data description, page: 66}]
  in_area_eic_code:
    description: EIC of the area flows come into (the in area of an oriented couple of areas).
    links: [{link: entsoe_brs, section: 7.4.1 Data description, page: 66}]
  transfer_capacity_mw:
    description: >-
      Capacity for flows from the out area to the in area over the interval, in MW. ENTSO-E, the forecasted
      transfer capacity (the minimum submitted for the couple of areas; may be negative where the market
      algorithm restricts the exchange to one direction); NESO, the maximum flow NESO submits to the
      interconnector's capacity calculation, which the final capacity may undercut. Compare within one source.
    links:
    - {link: entsoe_brs, section: 7.4.6 Processing, page: 67}
    - {link: entsoe_ddd, section: Estimated and offered cross-zonal capacity, page: 38}
    - neso_nsl
  restriction_reason:
    description: NESO's reason for the restriction in this direction (e.g. `Network Constraints`, `No Restriction`); null for ENTSO-E.
    links: [neso_nsl]
  # --- weather forecast (ECMWF Parameter Database) ------------------------------------------------
  temperature_2m_c:
    description: >-
      2 metre temperature at the start of the interval, in °C: "the temperature of air at 2m above the
      surface of land, sea or in-land waters"; "Temperature measured in kelvin can be converted to
      degrees Celsius (°C) by subtracting 273.15."
    links: [param_2t]
  wind_u_10m_ms:
    description: >-
      10 metre U wind component at the start of the interval, inm/s: "the eastward component of the 10m
      wind ... the horizontal speed of air moving towards the east, at a height of ten metres above the
      surface of the Earth".
    links: [param_10u]
  wind_v_10m_ms:
    description: >-
      10 metre V wind component at the start of the interval, inm/s: "the northward component of the 10m
      wind ... the horizontal speed of air moving towards the north, at a height of ten metres above the
      surface of the Earth".
    links: [param_10v]
  wind_speed_10m_ms:
    description: >-
      Speed of the horizontal 10 m wind at the start of the interval, inm/s: the U and V components
      combined (sqrt(u² + v²)); "This parameter can be combined with the V component of 10m wind to give
      the speed and direction of the horizontal 10m wind."
    links: [param_10u, param_10v]
  wind_u_100m_ms:
    description: >-
      100 metre U wind component at the start of the interval, inm/s: "the eastward component of the
      100 m wind ... the horizontal speed of air moving towards the east, at a height of 100 metres
      above the surface of the Earth".
    links: [param_100u]
  wind_v_100m_ms:
    description: >-
      100 metre V wind component at the start of the interval, inm/s: "the northward component of the
      100 m wind ... the horizontal speed of air moving towards the north, at a height of 100 metres
      above the surface of the Earth".
    links: [param_100v]
  wind_speed_100m_ms:
    description: >-
      Speed of the horizontal 100 m wind at the start of the interval, inm/s: the U and V components
      combined (sqrt(u² + v²)); "This parameter can be combined with the northward component to give the
      speed and direction of the horizontal 100 m wind."
    links: [param_100u, param_100v]
  solar_radiation_wm2:
    description: >-
      Surface short-wave (solar) radiation downwards, mean over the interval in W/m²: "the amount of
      solar radiation ... that reaches a horizontal plane at the surface of the Earth", "both direct and
      diffuse"; "To convert to watts per square metre (W m-2), the accumulated values should be divided
      by the accumulation period expressed in seconds."
    links: [param_ssrd]
  cloud_cover_fraction:
    description: >-
      Total cloud cover at the start of the interval, 0-1: "the proportion of a grid box covered by
      cloud"; "Cloud fractions vary from 0 to 1." AIFS Single publishes it as 228164 in % ("See 228164 for
      the equivalent parameter in "%""), divided by 100.
    links: [param_tcc, param_tcc_percent]
  precipitation_mm:
    description: >-
      Total precipitation over the interval, in mm of water equivalent: "the accumulated liquid and
      frozen water, comprising rain and snow, that falls to the Earth's surface", in "depth in metres of
      water equivalent" (x 1000 for mm). AIFS Single publishes it as 228228 in kg m**-2 ("See 228 for the
      equivalent parameter in "m""), which is mm of water.
    links: [param_tp, param_tp_kg]
  coverage:
    description: Fraction of the hour (0.0-1.0) holding data from the series' source. Means are over those
      minutes; multiply by `coverage` for the mean over the whole hour with missing minutes as zero.
  _series_key:
    description: Hash of the columns identifying the series (all but time, measures and provenance); with
      `timestamp_utc`, the row's key.
  # --- unavailability (REMIT; ACER MoP Annex VII) --------------------------------------------
  unavailable_capacity_mw:
    description: >-
      Unavailable capacity of the facility, in MW: the capacity affected by the event (ACER field 9), as
      published for the whole event. Where several events affect the same asset at the same time, each reports
      only the capacity made unavailable by its own event, so events add up.
    links:
    - {link: acer_remit_mop, section: Data Field No (9) Unavailable Capacity, page: 81}
  available_capacity_mw:
    description: >-
      Available capacity of the facility, in MW: the remaining capacity of the facility concerned (ACER field
      10), over the interval where the message publishes an outage profile, else for the whole event. Each
      event reports the facility's remaining capacity, so events do not add up.
    links:
    - {link: acer_remit_mop, section: Data Field No (10) Available Capacity, page: 81}
  installed_capacity_mw:
    description: >-
      Installed capacity of the facility, in MW: the nominal generating/transmission/consumption capacity
      (ACER field 11/a).
    links:
    - {link: acer_remit_mop, section: Data Field No (11/a) Installed Capacity, page: 84}
  interval_index:
    description: Position of the interval in the message's outage profile; empty where the row is the whole event
      period (no outage profile published).
    links:
    - {link: acer_remit_mop, section: Data Field No (20) Interval Start, page: 90}
