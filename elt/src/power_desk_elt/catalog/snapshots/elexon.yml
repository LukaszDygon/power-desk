entries:
  datasets/FUELINST:
    title: Instantaneous generation outturn by fuel type (FUELINST)
    summary: This endpoint provides the instantaneous generation outturn (Generation By Fuel type) to
      give our users an indication of the generation outturn for Great Britain. The data is aggregated
      by Fuel Type category and updated at five-minute intervals with average MW values over 5 minutes
      for each category.
    url: https://data.elexon.co.uk/bmrs/api/v1/datasets/FUELINST
  datasets/INDO:
    title: Initial National Demand outturn (INDO)
    summary: The endpoint provides data showing the initial National Demand outturn. Data is updated at
      15 min intervals containing the initial demand expressed in MW.
    url: https://data.elexon.co.uk/bmrs/api/v1/datasets/INDO
  datasets/ITSDO:
    title: Initial Transmission System Demand outturn (ITSDO)
    summary: The endpoint provides data showing the initial Transmission System Demand outturn. Data is
      updated at 15 min intervals containing the initial demand expressed in MW.
    url: https://data.elexon.co.uk/bmrs/api/v1/datasets/ITSDO
  datasets/MID:
    title: Market Index Data (MID)
    summary: 'This endpoint provides Market Index Data received from NGESO.


      Market Index Data is a key component in the calculation of System Buy Price and System Sell Price
      for each Settlement Period. This data is received from each of the appointed Market Index Data Providers
      (MIDPs) and reflects the price of wholesale electricity in Great Britain in the short term markets.
      The Market Index Data which is received from each MIDP for each Settlement Period consists of a
      Market Index Volume and Market Index Price, representing the volume and price of trading for the
      relevant period in the market operated by the MIDP. The Market Price (the volume weighed average
      Market Index Price) is used to derive the Reverse Price (SBP or SSP)."


      The two data providers available to query are N2EX ("N2EXMIDP") and APX ("APXMIDP").


      By default, the from and to parameters filter the data by time inclusively. If the settlementPeriodFrom
      or settlementPeriodTo parameters are provided, the corresponding from or to parameter instead filters
      on settlement date, allowing for searching by a combination of time and/or settlement date & settlement
      period. Note: When filtering via settlement date, from/to are treated as Dates only, with the time
      being ignored. For example, 2022-06-01T00:00Z and 2022-06-01T11:11Z are both treated as the settlement
      date 2022-06-01.


      All Dates and DateTimes should be expressed as defined within <a href="https://datatracker.ietf.org/doc/html/rfc3339#section-5.6"
      target="_blank">RFC 3339</a>.


      Some examples of date parameter combinations are shown below.


      Filtering from start time to start time:


      /datasets/mid?from=2022-06-01T00:00Z&to=2022-07-01T00:00Z


      Filtering from start time to settlement date and period:


      /datasets/mid?from=2022-06-01T00:00Z&to=2022-07-01T00:00Z&settlementPeriodTo=1


      Filtering from settlement date and period to start time:


      /datasets/mid?from=2022-06-01T00:00Z&to=2022-07-01T00:00Z&settlementPeriodFrom=1


      Filtering from settlement date and period to settlement date and period:


      /datasets/mid?from=2022-06-01T00:00Z&to=2022-07-01T00:00Z&settlementPeriodFrom=1&settlementPeriodTo=1'
    url: https://data.elexon.co.uk/bmrs/api/v1/datasets/MID
  datasets/NDF:
    title: Day and day-ahead National Demand forecast (NDF)
    summary: This endpoint provides the National Demand forecast received from NGESO. Data is available
      daily and will show values for the day ahead. Expressed as an average MW value for each settlement
      period. The forecast is based on historically metered generation output for Great Britain. This
      value INCLUDES transmission losses, but EXCLUDES interconnector flows and demand from station transformers
      and pumped storage units.
    url: https://data.elexon.co.uk/bmrs/api/v1/datasets/NDF
  datasets/REMIT:
    title: The Regulation on Wholesale Energy Markets Integrity and Transparency (REMIT)
    summary: 'The Regulation on Wholesale Energy Markets Integrity and Transparency (REMIT) is an EU regulation
      aimed at preventing market abuse in wholesale energy markets.


      This endpoint returns information provided by market participants to comply with Article 4 of Regulation
      on Wholesale Energy Market Integrity and Transparency (REMIT) Regulation (EU) 1227/2011.'
    url: https://data.elexon.co.uk/bmrs/api/v1/datasets/REMIT
  datasets/WINDFOR:
    title: Wind generation forecast (WINDFOR)
    summary: This endpoint provides wind generation forecast data.
    url: https://data.elexon.co.uk/bmrs/api/v1/datasets/WINDFOR
  glossary/bm-unit:
    title: BM Unit
    summary: Balancing Mechanism (BM) Units are used as units of trade within the Balancing Mechanism.
      Each BM Unit accounts for a collection of plant and/or apparatus, and is considered the smallest
      grouping that can be independently controlled. As a result, most BM Units contain either a generating
      unit or a collection of consumption meters
    definition: A unit established and registered (or to be established and registered) by a Party in
      accordance with Section K3 or, where the context so requires, the Plant and/or Apparatus treated
      as comprised in or assigned to such unit for the purposes of The Code.
    reference: '[BSC Section K – Classification and Registration of Metering Systems and BM Units](https://www.elexon.co.uk/bsc/the-bsc/bsc-section-k-classification-and-registration-of-metering-systems-and-bm-units/)'
    url: https://www.elexon.co.uk/bsc/glossary/bm-unit/
    modified: '2021-03-17'
  glossary/bm-unit-credit-assessment-export-capability:
    title: BM Unit Credit Assessment Export Capability
    acronym: BMCAECi
    summary: 'A value maintained for credit assessment purposes reflecting the transmission access Export
      rights of the BM Unit, GCi, corrected by the Credit Assessment Load Factor. Determined as follows:
      BMCAECi = CALFi * Gci where: CALFi is the Credit Assessment Load Factor applying in relation to
      the relevant BM Unit and GCi is the Generation Capacity of the BM Unit;'
    url: https://www.elexon.co.uk/bsc/glossary/bm-unit-credit-assessment-export-capability/
    modified: '2012-01-12'
  glossary/bm-unit-credit-assessment-import-capability:
    title: BM Unit Credit Assessment Import Capability
    acronym: BMCAICi
    summary: 'A value maintained for credit assessment purposes reflecting the transmission access Import
      rights of the BM Unit, DCi, corrected by the Credit Assessment Load Factor. Determined as follows:
      BMCAICi = CALFi * Dci where: CALFi is the Credit Assessment Load Factor applying in relation to
      the relevant BM Unit and DCi is the Demand Capacity of the BM Unit.'
    url: https://www.elexon.co.uk/bsc/glossary/bm-unit-credit-assessment-import-capability/
    modified: '2012-01-12'
  glossary/demand-capacity:
    title: Demand Capacity
    acronym: DC
    summary: 'Shall be the amount determined as: D / SPD where D is the value under paragraph 3.4.1(b)(the
      negative value of QMij with the maximum magnitude (subject to paragraph 3.4.4) for the BM Unit in
      the relevant BSC Season) most recently notified in relation to the BSC Season; has the meaning given
      to that term in Section K3.4.8;'
    url: https://www.elexon.co.uk/bsc/glossary/demand-capacity/
    modified: '2012-01-24'
  glossary/final-physical-notification:
    title: Final Physical Notification
    acronym: FPNij(t)
    summary: 'Final Physical Notification for a BM Unit is the level of Import or Export that the Party
      expects to Import or Export in a Settlement Period.

      Physical Notification is the best estimate of the level of generation or demand that a participant
      in the BM expects a BM Unit to export or import, respectively, in a Settlement Period. Initial Physical
      Notifications (IPNs), which are submitted to the System Operator at the day ahead stage, are not
      displayed on the Insights Solution or used in Settlement calculations. Final Physical Notifications
      (FPNs) have to be submitted to the System Operator by Gate Closure for each Settlement Period, and
      are both displayed on the Insights Solution and used in Settlement calculations.

      Physical Notifications are submitted as a series of point MW values; see the entry for Bid-Offer
      Data above for a diagrammatic example (in which the FPN values are shown as the red line).

      [Elexon Insights Solution](https://bmrs.elexon.co.uk/)'
    definition: 'The Final Physical Notification (FPN) for BM Unit is the level of Import or Export (as
      the case may be) that the Party expects to Import or Export from BM Unit i, in Settlement Period
      j, in the absence of any Balancing Mechanism Acceptances from the System Operator.

      The value of FPNij(t) is calculated for spot times in Settlement Period by linear interpolation
      from the discrete values of Point FPN submitted. The quantity established in accordance with Section
      T3.2.1.'
    reference: '[Section T: Settlement and Trading Charges](https://www.elexon.co.uk/bsc/simple-guide/section-t-settlement-trading-charges/)

      [BSC Section X, Annex X-2](https://www.elexon.co.uk/bsc/documents/bsc-codes/bsc-sections/bsc-section-x-2-technical-glossary/)'
    url: https://www.elexon.co.uk/bsc/glossary/final-physical-notification/
    modified: '2024-08-06'
  glossary/fuel-type:
    title: Fuel Type
    summary: 'There are a number of different fuel types these include Biomass, Coal, Hydro, Nuclear,
      Wind etc.

      The [BMU Fuel Type spreadsheet](https://www.elexon.co.uk/bsc/documents/data/operational-data/bmu-fuel-type/)
      provides a mapping for which balancing mechanism units (BMUs) makes up specific fuel types; the
      fuel type categorisation by balancing mechanism unit (BMU) is undertaken by National Grid ESO using
      the primary fuel type of each power station and is not based on the balancing mechanism unit (BMU)
      registration data held by Elexon.'
    url: https://www.elexon.co.uk/bsc/glossary/fuel-type/
    modified: '2024-02-22'
  glossary/generation-capacity:
    title: Generation Capacity
    acronym: GC
    summary: Each Balancing Mechanism (BM) Unit has a Generation Capacity (GC) and a Demand Capacity (DC).
      This is the maximum expected net Generation and Demand for that BM Unit in the current BSC Season.
    definition: 'Shall be the amount determined as: G / SPD where G is the value under paragraph 3.4.1(a)
      most recently notified in relation to the relevant BSC Season under paragraph 3.4. has the meaning
      given to that term in Section K3.4.8;'
    reference: '[BSC Section K: Classification and Registration of Metering Systems and BM Units](https://bscdocs.elexon.co.uk/bsc/bsc-section-k-classification-and-registration-of-metering-systems-and-bm-units)'
    url: https://www.elexon.co.uk/bsc/glossary/generation-capacity/
    modified: '2024-09-03'
  glossary/gsp-group:
    title: GSP Group
    summary: The connection between the Transmission and Distribution Systems is known as a Grid Supply
      Point (GSP). For this reason, each Distribution System is referred to as a GSP Group.
    definition: 'A distinct electrical system, consisting of:

      (i) The Distribution System(s) which are connected to the Transmission System at (and only at) Grid
      Supply Point(s) which fall within one Group of GSPs, and

      (ii) any Distribution System which:

      (1) is connected to a Distribution System in paragraph (i), or to any other Distribution System
      under this paragraph (ii)

      (2) is not connected to the Transmission System at any Grid Supply Point

      and the total supply into which is determined by metering for each half hour.'
    reference: '[BSC Section X, Annex X-1](https://www.elexon.co.uk/bsc/the-bsc/bsc-section-x-annex-x-1-general-glossary/)'
    url: https://www.elexon.co.uk/bsc/glossary/gsp-group/
    modified: '2021-05-24'
  glossary/initial-national-demand-out-turn:
    title: Initial National Demand Out-Turn
    acronym: INDO
    summary: The half-hour average MW demand metered by the Transmission Company based on its operational
      metering. The data is updated every 30 minutes and within 15 minutes of the end of the effective
      Settlement Period.
    definition: 'The demand metered by the National Electricity Transmission System Operator (NETSO) taking
      into account transmission losses but not including station transformer load, pumped storage demand
      or Interconnector demand.

      References to INDO in Section Q6.1.13 and in Table 1 of Section V Annex V-1 mean the half-hour average
      INDO for a Settlement Period. References to INDO in Section G3.1.4 mean the spot time INDO measured
      by the NETSO in accordance with that paragraph.'
    reference: '[BSC Section Q – Balancing Services Activities](https://www.elexon.co.uk/bsc/the-bsc/bsc-section-q-balancing-services-activities/)

      [BSC Section V – Reporting](https://www.elexon.co.uk/bsc/the-bsc/bsc-section-v-reporting/)

      [BSC Section G – Contingencies](https://www.elexon.co.uk/bsc/the-bsc/bsc-section-g-contingencies/)

      [BSC Section X, Annex X-1](https://www.elexon.co.uk/bsc/the-bsc/bsc-section-x-annex-x-1-general-glossary/)'
    url: https://www.elexon.co.uk/bsc/glossary/initial-national-demand-out-turn/
    modified: '2023-11-20'
  glossary/initial-transmission-system-demand-out-turn:
    title: Initial Transmission System Demand Out-Turn
    acronym: ITSDO
    summary: 'The average megawatt value of demand for a Settlement Period including transmission losses,
      station transformer load, pumped storage demand and interconnector demand.

      The ITSDO is made available by the System Operator within 15 minutes after a Settlement Period,
      based on their operational metering. The composition of the Initial Transmission System Demand Out-Turn
      matches that of the Transmission System Demand Forecast and so are comparable.'
    url: https://www.elexon.co.uk/bsc/glossary/initial-transmission-system-demand-out-turn/
    modified: '2023-11-20'
  glossary/instantaneous-generation-by-fuel-type:
    title: Instantaneous Generation by Fuel Type
    acronym: FUELINST
    summary: National Grid measure system generation connected to the high voltage transmission system
      in real-time from operational metering. This is used in control timescales to assist with balancing
      the system and confirming that generators are operating at their expected levels. To provide market
      participants with information relating to the levels of generation, this metering is aggregated
      into fuel type categories. The data is provided as 5 minute average MW values.
    url: https://www.elexon.co.uk/bsc/glossary/instantaneous-generation-by-fuel-type/
    modified: '2023-11-20'
  glossary/interconnector:
    title: Interconnector
    summary: 'An interconnector is a high-voltage cable that connects the electricity systems of neighbouring
      countries or regions. These interconnectors allow for the trading of electricity between different
      markets, enabling the transfer of surplus energy from one area to another.

      Each physical Interconnector has an Interconnector Administrator and an Interconnector Error Administrator,
      both of which are also BSC Parties.'
    definition: Means Apparatus, connected to a System, for the transfer of electricity to or from the
      Total System from or to an External System;
    reference: '[BSC Section K: Classification and Registration of Metering Systems and BM Units](https://bscdocs.elexon.co.uk/bsc/bsc-section-k-classification-and-registration-of-metering-systems-and-bm-units)'
    url: https://www.elexon.co.uk/bsc/glossary/interconnector/
    modified: '2024-10-11'
  glossary/interconnector-bm-unit:
    title: Interconnector BM Unit
    summary: 'Interconnector BM Units allow parties to trade over a particular Interconnector. Interconnector
      BM Units always come in pairs: A Production BM Unit for electricity entering the GB Total System;
      and A Consumption BM Unit for electricity being taken off the GB Total System.

      If you register to use a particular Interconnector, you will be assigned both a Production and a
      Consumption BM Unit for that Interconnector.'
    definition: A notional BM Unit associated with an Interconnector; and an Interconnector BM Unit shall
      be treated as a BM Unit for all purposes of the Code. has the meaning given to that term in Section
      K5.5.1;
    reference: '[BSC Section K: Classification and Registration of Metering Systems and BM Units](https://bscdocs.elexon.co.uk/bsc/bsc-section-k-classification-and-registration-of-metering-systems-and-bm-units)'
    url: https://www.elexon.co.uk/bsc/glossary/interconnector-bm-unit/
    modified: '2024-10-14'
  glossary/lead-party:
    title: Lead Party
    summary: The Party registered to a BM Unit.
    definition: In relation to a BM Unit, the Party registered or to be registered in respect of the BM
      Unit pursuant to Section K3.
    reference: '[BSC Section K – Classification and Registration of Metering Systems and BM Units](https://www.elexon.co.uk/bsc/the-bsc/bsc-section-k-classification-and-registration-of-metering-systems-and-bm-units/)

      [BSC Section X, Annex X-1](https://www.elexon.co.uk/bsc/documents/bsc-codes/bsc-sections/bsc-section-x-1-general-glossary/)'
    url: https://www.elexon.co.uk/bsc/glossary/lead-party/
    modified: '2020-12-29'
  glossary/market-index-data:
    title: Market Index Data
    summary: 'Market Index Data is a key component in the calculation of System Buy Price and System Sell
      Price for each Settlement Period. This data is received from each of the appointed Market Index
      Data Providers (MIDPs) and reflects the price of wholesale electricity in Great Britain in the short
      term markets.

      The Market Index Data which is received from each MIDP for each Settlement Period consists of a
      Market Index Volume and Market Index Price, representing the volume and price of trading for the
      relevant period in the market operated by the MIDP. The Market Price (the volume weighed average
      Market Index Price) is used to derive the Reverse Price (SBP or SSP).'
    definition: The data to be provided by the Market Index Data Provider(s) in accordance with the Market
      Index Definition Statement or, in relation to a particular Market Index Data Provider, the data
      to be so provided by that Market Index Data Provider, in each case as set out within the BSC.
    reference: '[BSC Section X, Annex 1](https://www.elexon.co.uk/bsc/the-bsc/bsc-section-x-annex-x-1-general-glossary/)'
    url: https://www.elexon.co.uk/bsc/glossary/market-index-data/
    modified: '2024-08-06'
  glossary/market-index-data-provider:
    title: Market Index Data Provider
    summary: A person or group who are responsible for making available Market Index Data in each Settlement
      Period.
    definition: Nomination of the particular entity or entities which shall be responsible for making
      available Market Index Data in respect of each Settlement Period. has the meaning given to that
      term in Section T1.5.2.
    reference: '[BSC Section T – Settlement and Trading Charges](https://www.elexon.co.uk/bsc/the-bsc/bsc-section-t-settlement-and-trading-charges/)

      [BSC Section X, Annex 1](https://www.elexon.co.uk/bsc/the-bsc/bsc-section-x-annex-x-1-general-glossary/)'
    url: https://www.elexon.co.uk/bsc/glossary/market-index-data-provider/
    modified: '2021-03-17'
  glossary/market-index-price:
    title: Market Index Price
    acronym: PXPsj
    summary: A value calculated using Market Index Data Provider for a Settlement Period.
    definition: In relation to a Market Index Data Provider and a Settlement Period, the price data to
      be provided by that Market Index Data Provider in accordance with the Market Index Definition Statement.
    reference: '[BSC Section X, Annex X-1](https://www.elexon.co.uk/bsc/documents/bsc-codes/bsc-sections/bsc-section-x-1-general-glossary/)'
    url: https://www.elexon.co.uk/bsc/glossary/market-index-price/
    modified: '2021-03-24'
  glossary/market-index-volume:
    title: Market Index Volume
    acronym: QXPsj
    summary: In relation to a Market Index Data Provider and a Settlement Period, the volume data to be
      provided by that Market Index Data Provider in accordance with the Market Index Definition Statement
    url: https://www.elexon.co.uk/bsc/glossary/market-index-volume/
    modified: '2012-02-20'
  glossary/national-demand-forecast:
    title: National Demand Forecast
    acronym: NDF
    summary: 'The National Demand Forecast is made by the System Operator. The System Operator National
      Demand Forecast is based on historically metered generation output for Great Britain. This value
      includes transmission losses, but excludes Interconnector flows and demand from station transformers
      and pumped storage units.

      The National Demand Forecast is comparable with the Initial National Demand Out-Turn INDO. All the
      forecasts are unrestricted, i.e. any notified customer demand management is included in the history.'
    url: https://www.elexon.co.uk/bsc/glossary/national-demand-forecast/
    modified: '2023-11-20'
  glossary/production-bm-unit:
    title: Production BM Unit
    summary: Each BM Unit has a Production or Consumption (P/C) Status which, on any given Settlement
      Day, is either Production or Consumption. Production BM Unit refers to a Balancing Mechanism (BM)
      Unit that is classified as having a Production status. This means it is primarily involved in generating
      electricity rather than consuming it.
    definition: 'Means a BM Unit which:

      (i) in the case of a BM Unit other than an Interconnector BM Unit, is classified as a Production
      BM Unit in accordance with the provisions of Section K3.5.2 or, in the case of an Exempt Export
      BM Unit, the Lead Party has elected to treat as a Production BM Unit pursuant to Section K3.5.5;
      and

      (ii) in the case of an Interconnector BM Unit, is designated by the CRA as a ‘Production’ BM Unit
      pursuant to Section K5.5.5;'
    reference: '[BSC Section K: Classification and Registration of Metering Systems and BM Units](https://bscdocs.elexon.co.uk/bsc/bsc-section-k-classification-and-registration-of-metering-systems-and-bm-units)

      [Guidance Note on Production/Consumption Status and Flag](https://bscdocs.elexon.co.uk/guidance-notes/productionconsumption-status-and-flag)

      [Guidance Note on BM Units](https://bscdocs.elexon.co.uk/guidance-notes/bm-units-registration-of-balancing-mechanism-bm-units)'
    url: https://www.elexon.co.uk/bsc/glossary/production-bm-unit/
    modified: '2024-08-13'
  glossary/settlement-day:
    title: Settlement Day
    acronym: SD
    summary: The period from 00:00 hours to 24:00 hours on each day.
    reference: '[BSC Section X, Annex X-1](https://www.elexon.co.uk/bsc/the-bsc/bsc-section-x-annex-x-1-general-glossary/)'
    url: https://www.elexon.co.uk/bsc/glossary/settlement-day/
    modified: '2021-03-16'
  glossary/settlement-period:
    title: Settlement Period
    acronym: j
    summary: 'Settlement Periods always refer to local time (whether this is GMT or BST). Note when the
      clocks go forward an hour, referred to as a ‘short’ day, there are only 46 settlement period for
      that day. Similarly, when the clocks go back an hour, referred to as a ‘long’ day, there are 50
      settlement period for that day.

      [Settlement Period conversion table](https://www.elexon.co.uk/bsc/settlement/#:~:text=BSC%20Portal-,Settlement%20Periods,-For%20the%20purposes)'
    definition: A period of 30 minutes beginning on the hour or the half-hour and in accordance with paragraph
      4.3 of Annex X-2.
    reference: '[BSC Section X, Annex X-2](https://www.elexon.co.uk/bsc/the-bsc/bsc-section-x-annex-x-2-technical-glossary/)'
    url: https://www.elexon.co.uk/bsc/glossary/settlement-period/
    modified: '2023-08-21'
  glossary/spot-time:
    title: Spot Time
    summary: 'Many input variables and calculated values are given for spot times within the Code. Spot
      times are an instant in time, and have no duration.

      For example, Settlement Period j starts at the spot time occurring at the beginning of the half
      hour and ends at the spot time occurring exactly thirty minutes later. The spot time at the beginning
      of one period therefore coincides with the spot time at the end of the previous period. For the
      avoidance of doubt the first Settlement Period of a Settlement Day begins at the spot time 00:00
      on the current Settlement Day (D), and ends at the spot time of 00:30 for the current Settlement
      Day D.'
    url: https://www.elexon.co.uk/bsc/glossary/spot-time/
    modified: '2024-07-25'
  glossary/transmission-loss-factor:
    title: Transmission Loss Factor
    acronym: TLFij
    summary: The Transmission Loss Factor is used to allocate transmission losses based on location.
    definition: The Transmission Loss Factor is that factor used to allocate transmission losses on a
      locational basis to BM Unit i in Settlement Period j. The factor specified in Section T2.2.1(a),
      being equal to zero.
    reference: '[BSC Section T – Settlement and Trading Charges](https://www.elexon.co.uk/bsc/the-bsc/bsc-section-t-settlement-and-trading-charges/)

      [BSC Section X, Annex X-2](https://www.elexon.co.uk/bsc/the-bsc/bsc-section-x-annex-x-2-technical-glossary/)'
    url: https://www.elexon.co.uk/bsc/glossary/transmission-loss-factor/
    modified: '2021-03-29'
  glossary/wind-generation-forecast:
    title: Wind Generation Forecast
    acronym: WINDFOR
    summary: 'A forecast of generation for all Power Park Modules.

      This daily forecast provides values for 4 different times of day (04:30, 10:30, 16:30, 22:30) and
      each forecast includes 49 values covering the period from 21:00 on the current day (D) to 21:00
      D+2.'
    url: https://www.elexon.co.uk/bsc/glossary/wind-generation-forecast/
    modified: '2024-06-06'
