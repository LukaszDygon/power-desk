#!/usr/sbin/nft -f
# The host's firewall, behind the Robot (edge) firewall (robot-firewall.sh). Its own table only: k3s, flannel and
# Tailscale keep their rules in theirs. bootstrap.sh replaces @PUBLIC_IF@ with the public interface.
#
# From the internet: Tailscale's WireGuard, and HTTPS to the cluster's ingress (ENTSO-E's pushes). Everything
# else (SSH, the Kubernetes API, the UIs) only over the tailnet, where Tailscale's policy decides who.

define PUBLIC = "@PUBLIC_IF@"

table inet power_desk
delete table inet power_desk

table inet power_desk {
  chain input {
    type filter hook input priority filter; policy drop;
    ct state established,related accept
    ct state invalid drop
    iif lo accept
    iifname "tailscale0" accept
    iifname { "cni0", "flannel.1" } accept  # pods to the node (DNS, the API server)
    meta l4proto { icmp, ipv6-icmp } accept
    iifname $PUBLIC udp dport 41641 accept  # Tailscale's direct connections (else it relays)
  }

  # The ingress's ports reach pods through DNAT, so they are filtered here, by their original port.
  chain forward {
    type filter hook forward priority filter; policy accept;
    iifname $PUBLIC ct state new ct original proto-dst != 443 drop
  }
}
