# Hetzner installimage (from the Rescue System) for the Power Desk server: Ubuntu 24.04 on software RAID 1
# over both NVMe drives, with LVM. bootstrap.sh adds the data volume (XFS) and leaves the rest of vg0 free for
# the backup's snapshots. Copy to /autosetup in the Rescue System and run `installimage` (docs/hosting.md).
# Check the drive names (`lsblk`) and the image name (`ls /root/images`) first.
DRIVE1 /dev/nvme0n1
DRIVE2 /dev/nvme1n1
SWRAID 1
SWRAIDLEVEL 1
BOOTLOADER grub
HOSTNAME power-desk
# UEFI boot; drop this line if the server boots legacy BIOS (older models such as the AX41 may: check in Rescue,
# `[ -d /sys/firmware/efi ] && echo UEFI`)
PART /boot/efi esp 256M
PART /boot ext4 1024M
PART lvm vg0 all
LV vg0 root / ext4 40G
LV vg0 swap swap swap 8G
IMAGE /root/images/Ubuntu-2404-noble-amd64-base.tar.gz
