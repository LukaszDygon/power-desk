[project]
name = "openmetadata-duckdb"
version = "0.1.0"
description = "OpenMetadata custom database connector for a DuckDB file: schemas, tables, views and columns"
requires-python = ">=3.10"
dependencies = [
    # match the OpenMetadata server's version
    "openmetadata-ingestion[dbt]~=2.0.7",  # dbt: the dbt workflow (configs/dbt.yaml)
    # match the warehouse's DuckDB (root uv.lock): a file written by a newer DuckDB does not open
    "duckdb==1.5.5",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
