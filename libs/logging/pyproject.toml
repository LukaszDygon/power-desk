[project]
name = "power-desk-logging"
version = "0.1.0"
description = "The Power Desk log standard (docs/logging.md), shared by the orchestrator and the services"
requires-python = ">=3.13"
dependencies = ["dlt>=1.30.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"
venvPath = "../.."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
