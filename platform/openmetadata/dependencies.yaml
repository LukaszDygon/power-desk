# OpenMetadata's dependencies on a local cluster, at minimum sizes for trying things out: MySQL and a
# single-node OpenSearch.
# No Airflow: ingestion runs from the CLI (`make catalog`), as our DuckDB connector reads the local warehouse.
mysql:
  image:
    pullPolicy: IfNotPresent
  auth:
    rootPassword: password  # local cluster only
  primary:
    extraFlags: "--sort_buffer_size=10M --innodb-buffer-pool-size=128M --performance-schema=OFF"
    persistence:
      size: 2Gi
    resourcesPreset: none
    # the default 1 s probes time out on a busy small node and restart MySQL
    livenessProbe: {timeoutSeconds: 10, failureThreshold: 6}
    readinessProbe: {timeoutSeconds: 10}
    resources:
      requests: {cpu: 100m, memory: 384Mi}
      limits: {memory: 768Mi}

opensearch:
  imagePullPolicy: IfNotPresent
  opensearchJavaOpts: "-Xmx512m -Xms512m"
  persistence:
    size: 2Gi
  resources:  # the heap plus the JVM's off-heap memory: 900Mi was OOM-killed
    requests: {cpu: 100m, memory: 900Mi}
    limits: {memory: 1280Mi}

airflow:
  enabled: false
