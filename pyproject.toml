[project]
name = "power-desk"
version = "0.1.0"
description = "Analyst dashboard for power and energy data on a dlt -> DuckDB -> dbt warehouse orchestrated by Dagster"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dagster>=1.13.27",
    "dagster-dbt>=0.29.27",
    "dagster-dg-cli>=1.13.27",
    "dagster-dlt>=0.29.27",
    "dagster-webserver>=1.13.27",
    "dbt-oss>=2.0.8",
    "dlt[duckdb]>=1.0.0",
    "duckdb>=1.1.0",
    "fastapi>=0.115.0",
    "jinja2>=3.1.0",
    "pyarrow>=18",
    "pydantic>=2.0.0",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0",
    "tenacity>=9.1",
    "uvicorn[standard]>=0.30.0",
]

[project.scripts]
power-desk = "power_desk.dashboard.app:main"
power-desk-dagster = "power_desk.cli.dagster:main"
power-desk-backfill = "power_desk.cli.backfill:main"
power-desk-load-seed = "power_desk.cli.load_seed:main"
power-desk-register-widget = "power_desk.cli.register_widget:main"

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pyright==1.1.407",
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "power_desk"
defs_module = "power_desk.orchestration"
code_location_target_module = "power_desk.orchestration.definitions"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["power_desk", "tests"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["dlt.sources.incremental"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"
