[project]
name = "power-desk"
version = "0.1.0"
description = "Minimalist analyst dashboard for UK Power & Energy Data using DuckDB, dlt, and DBT models"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dlt[duckdb]>=1.0.0",
    "duckdb>=1.1.0",
    "fastapi>=0.115.0",
    "jinja2>=3.1.0",
    "pydantic>=2.0.0",
    "requests>=2.31.0",
    "uvicorn[standard]>=0.30.0",
]

[project.scripts]
power-desk = "power_desk.app:main"

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
