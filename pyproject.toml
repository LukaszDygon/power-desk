# The workspace: one environment and lock for every project; each project keeps its own dependencies, tests
# and type-check settings in its pyproject.toml. Checks: `make check` (README.md, "Before pushing").
[project]
name = "power-desk"
version = "0.1.0"
description = "Analyst dashboard for power and energy data on a dlt -> DuckDB -> dbt warehouse orchestrated by Dagster"
requires-python = ">=3.13"
dependencies = ["power-desk-dashboard", "power-desk-elt", "power-desk-services"]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "import-linter>=2.3",
    "pyright==1.1.407",
    "pytest>=8.0.0",
    "ruff>=0.12.0",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["elt", "dashboard", "services", "libs/*"]
# own lock: deployed into OpenMetadata's ingestion image, with its pins
exclude = ["infra/openmetadata-duckdb"]

[tool.uv.sources]
power-desk-dashboard = { workspace = true }
power-desk-elt = { workspace = true }
power-desk-logging = { workspace = true }
power-desk-services = { workspace = true }
power-desk-warehouse = { workspace = true }

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# experiment scripts: long one-off expressions; their stage closures run immediately inside the loop
"elt/bench/**" = ["E501", "E741", "B023"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = [
    "openmetadata_duckdb",
    "power_desk_dashboard",
    "power_desk_elt",
    "power_desk_logging",
    "power_desk_services",
    "power_desk_warehouse",
    "tests",
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["dlt.sources.incremental"]

# `uv run pyright`: every project in one pass, each resolving its own `tests` package; `make check-<project>`
# checks one project with its own settings. Not covered: elt/bench (experiments) and the connector (own env).
[tool.pyright]
include = [
    "dashboard/src",
    "dashboard/tests",
    "elt/src",
    "elt/tests",
    "libs/logging/src",
    "libs/logging/tests",
    "libs/warehouse/src",
    "libs/warehouse/tests",
    "services/src",
    "services/tests",
]
executionEnvironments = [
    { root = "dashboard" },
    { root = "elt" },
    { root = "libs/logging" },
    { root = "libs/warehouse" },
    { root = "services" },
]
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"

# The boundaries between projects (`uv run lint-imports`): they meet only through libs/ and the
# warehouse's files (DuckDB, the dbt manifest, the landing zone), never by importing one another.
[tool.importlinter]
root_packages = [
    "power_desk_dashboard",
    "power_desk_elt",
    "power_desk_logging",
    "power_desk_services",
    "power_desk_warehouse",
]

[[tool.importlinter.contracts]]
name = "Projects do not import one another"
type = "independence"
modules = ["power_desk_dashboard", "power_desk_elt", "power_desk_services"]

[[tool.importlinter.contracts]]
name = "Libraries do not import projects"
type = "forbidden"
source_modules = ["power_desk_logging", "power_desk_warehouse"]
forbidden_modules = ["power_desk_dashboard", "power_desk_elt", "power_desk_services"]

[[tool.importlinter.contracts]]
name = "Services land files and never touch the warehouse"
type = "forbidden"
source_modules = ["power_desk_services"]
forbidden_modules = ["power_desk_warehouse"]
