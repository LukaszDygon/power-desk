[project]
name = "power-desk"
version = "0.1.0"
description = "Minimalist analyst dashboard for UK Power & Energy Data using DuckDB, dlt, and DBT models"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dagster>=1.13.27",
    "dagster-dbt>=0.29.27",
    "dagster-dg-cli>=1.13.27",
    "dagster-dlt>=0.29.27",
    "dagster-webserver>=1.13.27",
    "dbt-oss>=2.0.8",
    "dlt[duckdb]>=1.0.0",
    "duckdb>=1.1.0",
    "fastapi>=0.115.0",
    "jinja2>=3.1.0",
    "pydantic>=2.0.0",
    "requests>=2.31.0",
    "uvicorn[standard]>=0.30.0",
]

[project.scripts]
power-desk = "power_desk.app:main"

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "power_desk"
defs_module = "power_desk.orchestration"
code_location_target_module = "power_desk.orchestration.definitions"
