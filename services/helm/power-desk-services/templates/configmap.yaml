apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "pds.fullname" . }}
  labels:
    {{- include "pds.labels" . | nindent 4 }}
data:
  POWER_DESK_ENV: {{ .Values.environment | quote }}
  POWER_DESK_LANDING_URL: {{ .Values.landing.url | quote }}
  POWER_DESK_LOG_LEVEL: {{ .Values.logLevel | quote }}
  {{- range $key, $value := .Values.env }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
