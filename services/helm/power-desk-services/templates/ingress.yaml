{{- range $name, $svc := .Values.services }}
{{- if and $svc.enabled $svc.servicePort $svc.ingress $svc.ingress.enabled }}
{{- $ctx := dict "root" $ "name" $name }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "pds.serviceName" $ctx }}
  labels:
    {{- include "pds.serviceLabels" $ctx | nindent 4 }}
  {{- with $svc.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $svc.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if $svc.ingress.tlsSecretName }}
  tls:
    - hosts: [{{ required "ingress.host is required" $svc.ingress.host | quote }}]
      secretName: {{ $svc.ingress.tlsSecretName }}
  {{- end }}
  rules:
    - host: {{ required "ingress.host is required" $svc.ingress.host | quote }}
      http:
        paths:
          - path: /subscriptions
            pathType: Exact
            backend:
              service:
                name: {{ include "pds.serviceName" $ctx }}
                port:
                  name: http
{{- end }}
{{- end }}
