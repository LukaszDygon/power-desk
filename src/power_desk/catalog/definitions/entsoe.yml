sources:
  entsoe:
    description: >-
      ENTSO-E Transparency Platform data items, loaded by the `entsoe` dlt pipeline from the File
      Library's monthly exports, as published; each table keeps the versions of its rows (scd2) merged
      on the natural key.
tables:
  entsoe__actual_total_load:
    title: Actual total load per bidding zone per market time unit
    description: >-
      The total load per market time unit: the sum of power generated by plants on both TSO and DSO
      networks, minus the balance of exchanges with neighbouring bidding zones and the power absorbed by
      energy storage. The average of real-time load values over the market time unit, including losses;
      published at the latest one hour after the operating period.
    links:
    - {link: entsoe_ddd, section: Total load per bidding zone per market time unit, page: 19}
    - {link: transparency_regulation, section: Article 6(1)(a)}
    - {link: entsoe_file_library, path: TP_export/ActualTotalLoad_6.1.A_r3}
    freshness: daily_exports
    columns: {date_time_utcx: date_time_utc, update_time_utcx: update_time_utc, total_load_mwx: entsoe_actual_total_load_mw}
  entsoe__day_ahead_total_load_forecast:
    title: Day-ahead forecast of the total load per market time unit
    description: >-
      A day-ahead forecast of the total load per bidding zone per market time unit, published at the
      latest two hours before day-ahead gate closure (or D-1 12:00 local time where there is none) and
      updated when a market time unit changes by at least 10%. Given for information only; based on
      historic load profiles and weather.
    links:
    - {link: entsoe_ddd, section: Day-ahead forecast of the total load per market time unit, page: 20}
    - {link: transparency_regulation, section: Article 6(1)(b)}
    - {link: entsoe_file_library, path: TP_export/DayAheadTotalLoadForecast_6.1.B_r3}
    freshness: daily_exports
    columns: {date_time_utcx: date_time_utc, update_time_utcx: update_time_utc, total_load_mwx: entsoe_day_ahead_total_load_mw}
  entsoe__generation_per_type:
    title: Aggregated generation per type
    description: >-
      Actual aggregated net generation output per market time unit and per production type: the
      average of the available instantaneous net output values (small units may be estimated). Includes
      actual wind and solar generation. Published at the latest one hour after the operational period.
    links:
    - {link: entsoe_ddd, section: Aggregated generation per type, page: 77}
    - {link: transparency_regulation, section: Article 16(1)(b) and (c)}
    - {link: entsoe_file_library, path: TP_export/AggregatedGenerationPerType_16.1.B_C_r3}
    freshness: daily_exports
    columns: {date_time_utcx: date_time_utc, update_time_utcx: update_time_utc, actual_generation_output_mwx: actual_generation_output_mw,
              actual_consumption_mwx: actual_consumption_mw}
  entsoe__wind_solar_forecast:
    title: Day-ahead generation forecasts for wind and solar
    description: >-
      Forecasts of wind and solar net generation per bidding zone per market time unit of the following
      day, as three values: day-ahead (fixed at 18:00 Brussels time the day before), intraday (fixed at
      08:00 Brussels time on the day) and current (the latest update). Published for bidding zones with
      significant wind or solar feed-in.
    links:
    - {link: entsoe_ddd, section: Day ahead generation forecasts for wind and solar, page: 68}
    - {link: transparency_regulation, section: Article 14(1)(d)}
    - {link: entsoe_file_library, path: TP_export/GenerationForecastsForWindAndSolar_14.1.D_r3}
    freshness: daily_exports
    columns: {date_time_utcx: date_time_utc, update_time_utcx: update_time_utc, day_ahead_generation_forecast_mwx: entsoe_day_ahead_forecast_mw,
              intraday_generation_forecast_mwx: entsoe_intraday_forecast_mw,
              current_generation_forecast_mwx: entsoe_current_forecast_mw}
  entsoe__energy_prices:
    title: Energy prices
    description: >-
      For every market time unit the energy prices in each bidding zone, in currency per MWh, for
      bidding zones covered by an implicit allocation of cross-border transmission capacity. Day-ahead
      prices are mandatory, published no later than one hour after gate closure (the output time of the
      matching algorithms); intraday prices are published voluntarily. Prices are given per bidding zone,
      contract type (time horizon) and delivery period.
    links:
    - {link: entsoe_ddd, section: Energy Prices, page: 56}
    - {link: entsoe_brs, section: "7.22 Energy prices [12.1.D]", page: 128}
    - {link: transparency_regulation, section: Article 12(1)(d)}
    - {link: entsoe_file_library, path: TP_export/EnergyPrices_12.1.D_r3.1}
    freshness: daily_exports
    columns: {date_time_utcx: date_time_utc, update_time_utcx: update_time_utc, price_currency_m_whx: entsoe_energy_price}

columns:
  date_time_utc:
    description: Start of the market time unit (UTC).
    links: [entsoe_file_library]
  resolution_code:
    description: >-
      Length of the market time unit as an ISO 8601 duration (`PT15M`, `PT30M`, `PT60M`). Areas move
      to shorter market time units over time, so one area can publish several resolutions.
    links: [entsoe_file_library]
  area_code:
    description: EIC (object type Y) of the area the value is published for.
    links: [entsoe_file_library, eic_manual]
  area_display_name:
    description: Transparency Platform display name of the area, e.g. `Germany (DE)` or `DE-LU`.
    links: [entsoe_file_library]
  area_type_code:
    description: >-
      Roles in which the area publishes the value, `/`-separated: `BZN` bidding zone, `CTA` control area,
      `CTY` country. The same physical flows are published at several levels (e.g. bidding zone DE-LU,
      country DE and the four German control areas), so sum over one level only.
    refs:
    - entsoe:eic-functions/bidding-zone
    - entsoe:eic-functions/control-area
    - entsoe:eic-functions/member-state
    links: [entsoe_file_library]
  area_map_code:
    description: Short area code used by the Transparency Platform maps, e.g. `DE_LU`, `NO2`.
    links: [entsoe_file_library]
  production_type:
    description: >-
      Production type as displayed by the Transparency Platform (e.g. `Fossil Gas`, `Wind Onshore`);
      one name per PsrType code (seed `entsoe_psr_types`).
    links: [{link: entsoe_codelist, section: PsrType, page: 8}]
  psr_type:
    description: ENTSO-E PsrType code of the production type (`B01`..`B25`).
    links: [{link: entsoe_codelist, section: PsrType, page: 8}]
  psr_definition:
    description: Definition of the PsrType in the ENTSO-E code lists.
    links: [{link: entsoe_codelist, section: PsrType, page: 8}]
  update_time_utc:
    description: >-
      Extract column `UpdateTime(UTC)`, of type "Date/Time [1]" (mandatory) in the ENTSO-E extract
      specifications, which publish no further definition. Used as the row's publication time
      (`publish_time_utc`, the ingest cursor).
    links: [entsoe_extract_actual_total_load, entsoe_extract_day_ahead_total_load_forecast,
            entsoe_extract_generation_per_type, entsoe_extract_wind_solar_forecast, entsoe_extract_energy_prices]
  entsoe_actual_total_load_mw:
    description: Actual total load for the market time unit, in MW.
    links: [entsoe_ddd]
  entsoe_day_ahead_total_load_mw:
    description: Day-ahead forecast of the total load for the market time unit, in MW (latest update).
    links: [entsoe_ddd]
  actual_generation_output_mw:
    description: Actual aggregated net generation output of the production type, in MW.
    links: [entsoe_ddd]
  actual_consumption_mw:
    description: >-
      Power absorbed by the production type, in MW; published for hydro pumped storage and energy
      storage, where the total load deducts it as absorbed energy. Empty otherwise.
    links: [entsoe_ddd]
  entsoe_day_ahead_forecast_mw:
    description: Day-ahead forecast at 18:00 Brussels time the day before, in MW; not updated afterwards.
    links: [entsoe_ddd]
  entsoe_intraday_forecast_mw:
    description: Intraday forecast at 08:00 Brussels time on the day of delivery, in MW; not updated afterwards.
    links: [entsoe_ddd]
  entsoe_current_forecast_mw:
    description: Current forecast, the latest update, in MW.
    links: [entsoe_ddd]
  instance_code:
    description: >-
      Extract column `InstanceCode`, of type "String [1]" (mandatory) in the extract specification, which
      publishes no further definition. Rows of several instances can share a market time unit; where data
      for the same time horizon, delivery period and classification sequence is received more than once,
      the platform publishes the most recently received.
    links: [entsoe_extract_energy_prices, {link: entsoe_brs, section: 7.22.4 Integration, page: 129}]
  contract_type:
    description: Time horizon of the price, `Day-ahead` or `Intraday`.
    links: [entsoe_extract_energy_prices, {link: entsoe_brs, section: 7.22.1 Data description, page: 128}]
  sequence:
    description: >-
      Classification sequence, also referred to as round: mandatory when two allocations have identical
      delivery periods, which it distinguishes; blank (a space) otherwise.
    links: [entsoe_extract_energy_prices, {link: entsoe_brs, section: 7.22.1 Data description, page: 128}]
  currency:
    description: Currency of the price, as an ISO 4217 code (e.g. `EUR`).
    links: [entsoe_extract_energy_prices]
  entsoe_energy_price:
    description: Energy price for the market time unit, in `currency` per MWh.
    links: [entsoe_extract_energy_prices, entsoe_ddd]
