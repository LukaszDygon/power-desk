# GB power-market concepts shared by sources keyed on UK settlement periods.
links:
  neso_historic_generation_mix:
    title: NESO Data Portal, Historic GB Generation Mix (data dictionary)
    url: https://www.neso.energy/data-portal/historic-generation-mix/historic_gb_generation_mix
columns:
  settlement_date:
    description: Settlement day the value belongs to. Settlement days run midnight to midnight UK local
      time (Europe/London), so a day spans 23, 24 or 25 hours of UTC time.
    refs:
    - elexon:glossary/settlement-day
  settlement_period:
    description: 'Half-hour settlement period within the settlement day, numbered from 1 at local midnight:
      1-48, or 1-46 / 1-50 on the spring / autumn clock-change days.'
    refs:
    - elexon:glossary/settlement-period
  fuel_type:
    description: BMRS fuel type category (CCGT, OCGT, OIL, COAL, NUCLEAR, WIND, PS, NPSHYD, BIOMASS, OTHER;
      `INT*` codes are interconnectors). SOLAR is added from PVLive. Mapped to canonical technologies by `map_technology`.
    refs:
    - elexon:glossary/fuel-type
