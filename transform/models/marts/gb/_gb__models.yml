# GB business marts. Column descriptions reference doc blocks generated from src/power_desk/catalog/definitions/.
models:
  - name: mart_gb_generation_mix
    description: >
      GB generation mix (FUELINST + PVLive) per 5-minute interval with the zero-carbon share. Incremental: intervals
      touched by a pending dlt load are recomputed in full from `ods_generation_actual`.
    data_tests:
      - dlt_unique:
          name: mart_gb_generation_mix_unique_key
          arguments:
            columns: [timestamp_utc]
      - expression_is_true:
          name: mart_gb_generation_mix_no_fuel_fan_out
          arguments:
            expression: "_source_rows = _fuel_types"
      - expression_is_true:
          name: mart_gb_generation_mix_clean_share_range
          # Exports and pumping are negative flows, so night-time shares can exceed 100%.
          config: {severity: warn}
          arguments:
            expression: "clean_share_pct between 0 and 100"
    columns:
      - name: timestamp_utc
        description: "{{ doc('col_timestamp_utc') }}"
        data_tests: [not_null]
      - name: settlement_date
        description: "{{ doc('col_settlement_date') }}"
      - name: settlement_period
        description: "{{ doc('col_settlement_period') }}"
      - name: wind_mw
        description: "{{ doc('col_wind_mw') }}"
      - name: solar_mw
        description: "{{ doc('col_solar_mw') }}"
      - name: nuclear_mw
        description: "{{ doc('col_nuclear_mw') }}"
      - name: ccgt_gas_mw
        description: "{{ doc('col_ccgt_gas_mw') }}"
      - name: biomass_mw
        description: "{{ doc('col_biomass_mw') }}"
      - name: hydro_mw
        description: "{{ doc('col_hydro_mw') }}"
      - name: coal_mw
        description: "{{ doc('col_coal_mw') }}"
      - name: imports_mw
        description: "{{ doc('col_imports_mw') }}"
      - name: other_fossil_mw
        description: "{{ doc('col_other_fossil_mw') }}"
      - name: total_generation_mw
        description: "{{ doc('col_total_generation_mw') }}"
      - name: clean_share_pct
        description: "{{ doc('col_clean_share_pct') }}"
      - name: _source_rows
        description: "{{ doc('col__source_rows') }}"
      - name: _fuel_types
        description: "{{ doc('col__fuel_types') }}"
      - name: _last_dlt_load_id
        description: "{{ doc('col__last_dlt_load_id') }}"
      - name: _dbt_invocation_id
        description: "{{ doc('col__dbt_invocation_id') }}"
      - name: _dbt_updated_at
        description: "{{ doc('col__dbt_updated_at') }}"

  - name: mart_gb_demand_vs_forecast
    description: >
      GB actual national demand (INDO) against the latest forecast (NDF) per settlement period,
      with forecast error. Incremental: periods touched by a pending load in either input
      are recomputed in full.
    data_tests:
      - dlt_unique:
          name: mart_gb_demand_vs_forecast_unique_key
          arguments:
            columns: [settlement_date, settlement_period]
      - expression_is_true:
          name: mart_gb_demand_vs_forecast_no_fan_out
          arguments:
            expression: "_source_rows between 1 and 2"
      - expression_is_true:
          name: mart_gb_demand_vs_forecast_delta_consistent
          arguments:
            expression: "delta_mw is null or abs(delta_mw - round(actual_demand_mw - forecast_demand_mw, 1)) < 0.11"
    columns:
      - name: timestamp_utc
        description: "{{ doc('col_timestamp_utc') }}"
        data_tests: [not_null]
      - name: settlement_date
        description: "{{ doc('col_settlement_date') }}"
      - name: settlement_period
        description: "{{ doc('col_settlement_period') }}"
      - name: actual_demand_mw
        description: "{{ doc('col_actual_demand_mw') }}"
      - name: forecast_demand_mw
        description: "{{ doc('col_forecast_demand_mw') }}"
      - name: delta_mw
        description: "{{ doc('col_delta_mw') }}"
      - name: absolute_error_pct
        description: "{{ doc('col_absolute_error_pct') }}"
      - name: _source_rows
        description: "{{ doc('col__source_rows') }}"
      - name: _last_dlt_load_id
        description: "{{ doc('col__last_dlt_load_id') }}"
      - name: _dbt_invocation_id
        description: "{{ doc('col__dbt_invocation_id') }}"
      - name: _dbt_updated_at
        description: "{{ doc('col__dbt_updated_at') }}"

  - name: mart_gb_hourly_summary
    description: >
      GB hourly rollup of the generation mix and demand marts. Incremental: hours containing a
      row whose latest contributing load is pending for this model are recomputed.
    data_tests:
      - dlt_unique:
          name: mart_gb_hourly_summary_unique_key
          arguments:
            columns: [hour_utc]
      - expression_is_true:
          name: mart_gb_hourly_summary_no_fan_out
          arguments:
            expression: "_source_rows <= 12"
    columns:
      - name: hour_utc
        description: "{{ doc('col_hour_utc') }}"
        data_tests: [not_null]
      - name: date_utc
        description: "{{ doc('col_date_utc') }}"
      - name: avg_demand_mw
        description: "{{ doc('col_avg_demand_mw') }}"
      - name: avg_forecast_demand_mw
        description: "{{ doc('col_avg_forecast_demand_mw') }}"
      - name: avg_generation_mw
        description: "{{ doc('col_avg_generation_mw') }}"
      - name: avg_wind_mw
        description: "{{ doc('col_avg_wind_mw') }}"
      - name: avg_solar_mw
        description: "{{ doc('col_avg_solar_mw') }}"
      - name: avg_nuclear_mw
        description: "{{ doc('col_avg_nuclear_mw') }}"
      - name: avg_gas_mw
        description: "{{ doc('col_avg_gas_mw') }}"
      - name: avg_clean_share_pct
        description: "{{ doc('col_avg_clean_share_pct') }}"
      - name: peak_demand_mw
        description: "{{ doc('col_peak_demand_mw') }}"
      - name: min_demand_mw
        description: "{{ doc('col_min_demand_mw') }}"
      - name: _source_rows
        description: "{{ doc('col__source_rows') }}"
      - name: _last_dlt_load_id
        description: "{{ doc('col__last_dlt_load_id') }}"
      - name: _dbt_invocation_id
        description: "{{ doc('col__dbt_invocation_id') }}"
      - name: _dbt_updated_at
        description: "{{ doc('col__dbt_updated_at') }}"
