      Actual transmission system demand per settlement period (GB).

      {{ doc('dataset_bmrs__itsdo') }}
    data_tests:
      - dlt_unique:
          name: ods_transmission_demand_actual_unique_key
          arguments:
            columns: [timestamp_utc, area_eic_code, source_dataset]
    columns:
      - name: timestamp_utc
        description: "{{ doc('col_timestamp_utc') }}"
        data_tests:
