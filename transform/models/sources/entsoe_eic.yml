sources:
- name: entsoe_eic
  description: ENTSO-E Energy Identification Codes published by the Central Issuing Office, loaded by the `entsoe_eic` dlt
    pipeline as scd2 snapshots (every published version kept).
  schema: raw
  tables:
  - name: entsoe_eic__codes
    description: '{{ doc(''dataset_entsoe_eic__codes'') }}'
    config:
      meta:
        dagster:
          asset_key:
          - raw
          - entsoe_eic__codes
        dlt:
          pipeline: entsoe_eic
          resource: entsoe_eic__codes
          write_disposition: merge
          merge_strategy: scd2
          primary_key: []
          cursor_column: null
        dlt_recent_column: _dlt_load_id
        references:
        - title: EIC approved codes (central registry)
          url: https://www.entsoe.eu/data/energy-identification-codes-eic/eic-approved-codes/
        - title: EIC Reference Manual 5.5
          url: https://eepublicdownloads.entsoe.eu/clean-documents/EDI/Library/EIC_Reference_Manual_Release_5_5.pdf
        - title: EIC data exchange implementation guide 1.2
          url: https://www.entsoe.eu/Documents/EDI/Library/cim_based/EIC_Data_Exchange_IG_v1.2.pdf
        - title: Mandatory attributes of the EIC codes
          url: https://eepublicdownloads.entsoe.eu/clean-documents/EDI/Library/Mandatory_attributes_of_the_EIC_codes.pdf
      loaded_at_field: to_timestamp(cast(_dlt_load_id as double))
    data_tests:
    - dlt_unique:
        name: entsoe_eic__codes_unique_row_version
        arguments:
          columns:
          - _dlt_id
          - _dlt_valid_from
    columns:
