# Per-data-item guards and completeness for the entsoe source. Staging holds the current version of each
# row (raw tables are scd2, merged on the natural key), incrementally by natural key. Where an area changes
# its market time unit, the overlap is published at both resolutions; the ods views keep the finest.
# Completeness is checked per day across all areas: an area's coverage is the publisher's (new areas,
# gaps), a missing day is a loading gap.
models:
  - name: stg_entsoe__actual_total_load
    description: |
      Actual total load typed, one row per area per market time unit.

      {{ doc('dataset_entsoe__actual_total_load') }}
    data_tests:
      - dlt_unique:
          name: stg_entsoe__actual_total_load_unique_key
          arguments:
            columns: [timestamp_utc, interval_minutes, area_eic_code, area_type_code]
    columns:
      - name: timestamp_utc
        description: "{{ doc('col_timestamp_utc') }}"
        data_tests:
          - not_null
          - no_missing_intervals:
              name: stg_entsoe__actual_total_load_no_missing_days
              arguments:
                interval: 1 day
      - name: interval_minutes
        description: "{{ doc('col_interval_minutes') }}"
        data_tests: [not_null]
      - name: area_eic_code
        description: "{{ doc('col_area_eic_code') }}"
        data_tests: [not_null]
      - name: area_type_code
        description: "{{ doc('col_area_type_code') }}"
      - name: area_map_code
        description: "{{ doc('col_area_map_code') }}"
      - name: demand_mw
        description: "{{ doc('col_entsoe_actual_total_load_mw') }}"
      - name: publish_time_utc
        description: "{{ doc('col_update_time_utc') }}"
      - name: _dlt_load_id
        description: "{{ doc('col__dlt_load_id') }}"

  - name: stg_entsoe__day_ahead_total_load_forecast
