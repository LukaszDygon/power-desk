      - name: _dlt_load_id
        description: "{{ doc('col__dlt_load_id') }}"

  - name: stg_entsoe__generation_per_type
    description: |
      Aggregated generation per type typed, one row per area per production type per market time
      unit, with the production type's PsrType code.

      {{ doc('dataset_entsoe__generation_per_type') }}
    data_tests:
      - dlt_unique:
          name: stg_entsoe__generation_per_type_unique_key
          arguments:
            columns: [timestamp_utc, area_eic_code, production_type]
    columns:
      - name: timestamp_utc
        description: "{{ doc('col_timestamp_utc') }}"
        data_tests:
          - not_null
          - no_missing_intervals:
              name: stg_entsoe__generation_per_type_no_missing_days
              arguments:
                interval: 1 day
      - name: interval_minutes
        description: "{{ doc('col_interval_minutes') }}"
        data_tests: [not_null]
      - name: area_eic_code
        description: "{{ doc('col_area_eic_code') }}"
        data_tests: [not_null]
      - name: area_type_code
        description: "{{ doc('col_area_type_code') }}"
      - name: area_map_code
