  - name: stg_entsoe__energy_prices
    description: |
      Energy prices typed, one row per area, contract type, classification sequence and market time
      unit; where several documents publish the same row, the most recently updated.

      {{ doc('dataset_entsoe__energy_prices') }}
    data_tests:
      - dlt_unique:
          name: stg_entsoe__energy_prices_unique_key
          arguments:
            columns: [timestamp_utc, interval_minutes, area_eic_code, area_type_code, contract_type, classification_sequence]
    columns:
      - name: timestamp_utc
        description: "{{ doc('col_timestamp_utc') }}"
        data_tests:
          - not_null
          - no_missing_intervals:
              name: stg_entsoe__energy_prices_no_missing_days
              arguments:
                interval: 1 day
      - name: interval_minutes
        description: "{{ doc('col_interval_minutes') }}"
        data_tests: [not_null]
      - name: area_eic_code
        description: "{{ doc('col_area_eic_code') }}"
