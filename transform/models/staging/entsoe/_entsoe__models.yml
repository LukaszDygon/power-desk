        data_tests: [not_null]
      - name: psr_type
        description: "{{ doc('col_psr_type') }}"
        data_tests:
          - not_null:
              name: stg_entsoe__generation_per_type_production_type_known
              config: {severity: warn}
      - name: generation_mw
        description: "{{ doc('col_actual_generation_output_mw') }}"
      - name: consumption_mw
