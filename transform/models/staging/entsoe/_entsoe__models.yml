          - no_missing_intervals:
              name: stg_entsoe__day_ahead_total_load_forecast_no_missing_days
              arguments:
                interval: 1 day
      - name: interval_minutes
        description: "{{ doc('col_interval_minutes') }}"
        data_tests: [not_null]
      - name: area_eic_code
        description: "{{ doc('col_area_eic_code') }}"
        data_tests: [not_null]
      - name: area_type_code
        description: "{{ doc('col_area_type_code') }}"
      - name: area_map_code
        description: "{{ doc('col_area_map_code') }}"
      - name: demand_mw
        description: "{{ doc('col_entsoe_day_ahead_total_load_mw') }}"
      - name: publish_time_utc
        description: "{{ doc('col_update_time_utc') }}"
