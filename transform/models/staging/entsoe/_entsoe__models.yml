        data_tests:
          - not_null
          - no_missing_intervals:
              name: stg_entsoe__generation_per_type_no_missing_days
              arguments:
                interval: 1 day
      - name: interval_minutes
        description: "{{ doc('col_interval_minutes') }}"
        data_tests: [not_null]
      - name: area_eic_code
        description: "{{ doc('col_area_eic_code') }}"
        data_tests: [not_null]
      - name: area_type_code
        description: "{{ doc('col_area_type_code') }}"
      - name: area_map_code
