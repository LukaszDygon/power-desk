        data_tests:
          - not_null
          - accepted_values:
              name: stg_entsoe__energy_prices_known_contract_type
              arguments:
                values: [Day-ahead, Intraday]
      - name: classification_sequence
        description: "{{ doc('col_sequence') }}"
      - name: price_per_mwh
        description: "{{ doc('col_entsoe_energy_price') }}"
        data_tests: [not_null]
      - name: currency
        description: "{{ doc('col_currency') }}"
        data_tests: [not_null]
      - name: instance_code
        description: "{{ doc('col_instance_code') }}"
      - name: publish_time_utc
        description: "{{ doc('col_update_time_utc') }}"
      - name: _dlt_load_id
        description: "{{ doc('col__dlt_load_id') }}"
